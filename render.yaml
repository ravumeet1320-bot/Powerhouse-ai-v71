services:
  - type: web
    name: powerhouse-ai-v56
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: UPSTOX_ENABLE_WEBSOCKET
        value: "true"
      - key: UPSTOX_ENABLE_BREADTH
        value: "true"
