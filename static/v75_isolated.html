<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POWERHOUSE AI V75 DYNAMITE</title>
<style>
:root{--bg:#06111c;--c:#0d2030;--l:#24445d;--t:#eaf6ff;--m:#8ca9c0;--cy:#37dcff;--g:#27e6a3;--r:#ff6680;--a:#ffd05c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06101a,#081624);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1500px;margin:auto;padding:12px 12px 92px}.top{position:sticky;top:0;z-index:9;background:#06111cf2;padding:12px 0;border-bottom:1px solid var(--l)}h1{font-size:21px;margin:0}.ver{color:var(--cy)}.sub{color:var(--m);font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0}.nav button,.btn{white-space:nowrap;border:1px solid var(--l);background:#0a1b29;color:var(--t);border-radius:10px;padding:9px}.nav button.on{border-color:var(--cy);color:var(--cy)}.card{background:linear-gradient(180deg,#0e2232,#0a1a28);border:1px solid var(--l);border-radius:15px;padding:13px;margin-bottom:10px}.title{font-weight:900;margin-bottom:10px}.row{border-top:1px solid #17344a;padding:10px 2px}.sym{font-weight:900;font-size:16px}.buy{color:var(--g)}.sell{color:var(--r)}.watch{color:var(--a)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{border:1px solid var(--l);border-radius:12px;padding:11px}.metric b{font-size:19px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#06111cf5;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:var(--m);padding:10px 2px}.bottom b{display:block;color:var(--t);font-size:18px}@media(min-width:760px){.bottom{display:none}.grid{grid-template-columns:repeat(5,1fr)}} 
</style></head><body><div class="app"><div class="top"><h1>♛ POWERHOUSE AI <span class="ver">V75.1 DYNAMITE 🧨</span></h1><div class="sub">ISOLATED SHELL • OLD-GOOD ENGINES LOCKED • READ-ONLY DECISION SUPPORT</div><div class="nav" id="nav"></div></div><div id="main"></div></div>
<nav class="bottom"><button onclick="openTab('COMMAND')"><b>⌂</b>Home</button><button onclick="openTab('PRE-MOVE')"><b>⚡</b>Pre-Move</button><button onclick="openTab('EXPIRY HERO')"><b>🔥</b>Hero</button><button onclick="openTab('CASH STOCKS')"><b>↯</b>Cash</button><button onclick="openTab('ALERTS')"><b>♟</b>Alerts</button></nav>
<script>
const tabs=['COMMAND','INDEX','AUTO TRENDER','PRE-MOVE','HEATMAP','EXPIRY HERO','CASH STOCKS','VOLUME SHOCKERS','SILENT SHOCKERS','LIQUIDITY','CIRCUITS','CHART','SMART MONEY','FII/DII','ALERTS','SYSTEM'];
let tab='COMMAND'; const E=x=>String(x??'—'); const C=s=>/BUY|UP/.test(E(s).toUpperCase())?'buy':/SELL|DOWN/.test(E(s).toUpperCase())?'sell':'watch';
function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${x===tab?'on':''}" onclick="openTab('${x}')">${x}</button>`).join('')}
function rows(a){return (a||[]).slice(0,150).map(x=>`<div class="row"><span class="sym">${E(x.symbol)}</span> <b class="${C(x.signal||x.action||x.direction)}">${E(x.signal||x.action||x.direction||x.state)}</b><div class="sub">${E(x.stage)} • ${E(x.change_pct)}% • RVOL ${E(x.rvol)}x • ${E(x.expiry||'')}</div></div>`).join('')||'<div class="sub">No qualified rows / feed warming.</div>'}
async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function openTab(t){tab=t;nav();let m=document.querySelector('#main');m.innerHTML='<div class="card">Loading '+t+'…</div>';try{
 if(t==='COMMAND'){let h=await J('/api/v75/health');m.innerHTML=`<div class="grid"><div class="metric">BUILD<br><b>${E(h.version)}</b></div><div class="metric">SHELL<br><b class="buy">ISOLATED</b></div><div class="metric">LEGACY<br><b>LOCKED</b></div><div class="metric">MODE<br><b>READ ONLY</b></div></div><div class="card"><div class="title">DYNAMITE COMMAND CENTER</div>Use dedicated tabs above. No duplicate surfaces. Legacy full UI remains available at <b>/legacy/</b>.</div>`}
 else if(t==='CASH STOCKS'||t==='AUTO TRENDER'||t==='PRE-MOVE'||t==='LIQUIDITY'||t==='CIRCUITS'||t==='SMART MONEY'){let d=await J('/api/v75/cash-war-room');m.innerHTML=`<div class="card"><div class="title">${t}</div>${rows(d.rows)}</div>`}
 else if(t==='VOLUME SHOCKERS'){let d=await J('/api/v75/volume-shockers');m.innerHTML=`<div class="card"><div class="title">VOLUME SHOCKERS</div>${rows(d.rows)}</div>`}
 else if(t==='SILENT SHOCKERS'){let d=await J('/api/v75/silent-shockers');m.innerHTML=`<div class="card"><div class="title">SILENT SHOCKERS</div>${rows(d.rows)}</div>`}
 else if(t==='ALERTS'){let d=await J('/api/v75/alerts');m.innerHTML=`<div class="card"><div class="title">DEDICATED ALERT DESK</div>${rows(d.rows)}</div>`}
 else if(t==='INDEX'){let d=await J('/api/v75/index');m.innerHTML=`<div class="card"><div class="title">INDEX WORKSPACE</div>${rows(d.rows)}</div>`}
 else if(t==='EXPIRY HERO'){let d=await J('/api/v75/expiry-hero');m.innerHTML=`<div class="card"><div class="title">EXPIRY-DAY HERO / GAMMA & LIQUIDITY</div>${rows(d.rows)}</div>`}
 else if(t==='SYSTEM'){let d=await J('/api/v75/system');m.innerHTML=`<div class="card"><div class="title">SYSTEM SELF-TEST</div><b class="buy">V${E(d.version)} • ISOLATED SHELL</b><div class="sub">${E(d.release)}</div><div class="row">${(d.surfaces||[]).join(' • ')}</div></div>`}
 else {m.innerHTML=`<div class="card"><div class="title">${t}</div><div class="sub">Preserved detailed engine lives in the locked legacy application. <button class="btn" onclick="location.href='/legacy/'">Open preserved ${t}</button></div></div>`}
 }catch(e){m.innerHTML=`<div class="card"><b class="sell">${t} DATA ERROR</b><div class="sub">${E(e.message)} — shell remains V75.</div></div>`}}
nav();openTab('COMMAND');
</script></body></html>
