<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f8f7ff" />
<title>POWERHOUSE AI V74.2 — Autonomous Call Intelligence</title>
<style>
:root{--bg:#f7f8ff;--ink:#142033;--muted:#667085;--line:rgba(70,82,120,.14);--glass:rgba(255,255,255,.80);--shadow:0 18px 55px rgba(80,91,138,.12);--good:#157347;--warn:#9a6700;--bad:#b42318;--blue:#3b5ccc;--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 4%,#e8ecff 0,transparent 32%),radial-gradient(circle at 91% 2%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 80% 80%,#e7fff5 0,transparent 30%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.shell{max-width:1760px;margin:auto;padding:12px 12px 80px}.top{position:sticky;top:0;z-index:30;padding-top:max(6px,env(safe-area-inset-top));backdrop-filter:blur(18px)}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:13px 15px}.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#8ea4ff,#f0a6cd,#8de2c0);display:grid;place-items:center;font-weight:900;color:#17214c}.brand h1{font-size:17px;line-height:1.1;margin:0}.brand small{display:block;color:var(--muted);margin-top:4px;font-weight:650}.statusrow{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:999px;padding:7px 9px;font-size:10px;font-weight:850}.pill.live{color:var(--good)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin}.tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.76);color:#4c5671;padding:9px 12px;border-radius:13px;font-size:11px;font-weight:850;cursor:pointer}.tab.active{background:#fff;color:#1d2d66;box-shadow:0 8px 25px rgba(74,87,140,.12)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:8px}.card{grid-column:span 3;background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;backdrop-filter:blur(16px)}.wide{grid-column:span 12}.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 2}.label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:850}.metric{font-size:27px;font-weight:900;margin-top:5px;line-height:1}.sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-title h2{font-size:14px;margin:0}.tag{font-size:9px;font-weight:850;color:var(--blue);background:#eef1ff;padding:5px 8px;border-radius:999px}
.tablewrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:820px;background:rgba(255,255,255,.55)}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:10px;vertical-align:top}th{position:sticky;top:0;background:#fbfbff;color:#5c6478;font-size:9px;letter-spacing:.04em;text-transform:uppercase;z-index:2}.stage{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;background:#eef1ff;color:#3f55a8}.pos{color:var(--good)}.neg{color:var(--bad)}
.controls{display:flex;gap:7px;flex-wrap:wrap}.input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font:inherit;font-size:11px;outline:none;min-width:155px}.btn{border:0;background:#263b83;color:#fff;padding:9px 12px;border-radius:12px;font-size:10px;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}
.call-card{border:1px solid var(--line);background:rgba(255,255,255,.76);border-radius:16px;padding:12px;margin-bottom:10px}.call-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.call-action{font-size:19px;font-weight:950}.call-action.buy{color:var(--good)}.call-action.wait{color:var(--warn)}.call-action.stop{color:var(--bad)}.call-grid{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:7px;margin-top:10px}.call-field{border:1px solid var(--line);background:rgba(248,249,252,.88);padding:9px;border-radius:12px}.call-field span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:800}.call-field b{display:block;margin-top:4px;font-size:12px}.call-reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.note{border-left:4px solid #8395e9;background:rgba(238,241,255,.72);padding:10px 12px;border-radius:11px;font-size:10px;line-height:1.5;color:#4e5870}.note.good{border-left-color:var(--good)}.note.bad{border-left-color:var(--bad)}
.truth{border-left:4px solid #8395e9;background:rgba(238,241,255,.72);padding:11px 13px;border-radius:12px;font-size:10px;line-height:1.5;color:#4e5870}.empty{padding:24px;text-align:center;color:var(--muted);font-size:11px}.error{border-left:4px solid var(--bad);background:#fff1f1;padding:11px;border-radius:12px;color:#7a271a;font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;font-size:9px;line-height:1.45;max-height:440px;overflow:auto;background:#f8f9fc;border:1px solid var(--line);padding:11px;border-radius:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.footer{margin-top:18px;color:var(--muted);font-size:9px;text-align:center}
.alert-toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-130%);z-index:9999;width:min(92vw,680px);background:#fff;border:1px solid var(--line);box-shadow:0 22px 60px rgba(20,32,51,.22);border-radius:18px;padding:12px 14px;transition:.22s;opacity:0;pointer-events:none}.alert-toast.show{transform:translateX(-50%) translateY(0);opacity:1}.alert-toast.p0{border-left:5px solid #b42318}.alert-toast.p1{border-left:5px solid #b54708}.alert-toast.p2{border-left:5px solid #175cd3}.alert-toast.p3{border-left:5px solid #667085}
@media(max-width:1150px){.card,.third{grid-column:span 6}.two{grid-column:span 4}.call-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.shell{padding:8px 8px 64px}.brand small{display:none}.statusrow .pill:nth-child(n+4){display:none}.card,.half,.third,.two{grid-column:span 12}.split,.call-reasons{grid-template-columns:1fr}.metric{font-size:24px}.tab{font-size:10px;padding:8px 9px}.call-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="alertToast" class="alert-toast"><b id="alertToastTitle">Alert</b><div id="alertToastBody" class="sub"></div></div>
<div class="shell">
  <div class="top">
    <div class="brandbar">
      <div class="brand"><div class="logo">P74</div><div><h1>POWERHOUSE AI V74.2</h1><small>Autonomous Call Intelligence • Hot Lane • Audit OS</small></div></div>
      <div class="statusrow"><span id="dataPill" class="pill">DATA —</span><span id="scannerPill" class="pill">SCANNER —</span><span id="hotPill" class="pill">HOT —</span><span id="coveragePill" class="pill">COVERAGE —</span><span class="pill">READ-ONLY</span></div>
    </div>
    <div id="tabs" class="tabs"></div>
  </div>
  <main id="content"></main>
  <div class="footer">Server scanning is independent of this page. CALL QUALITY is evidence quality, not profit probability. No broker orders are placed automatically.</div>
</div>
<script>
const DEFAULT_TABS=["COMMAND","MARKET","OPPORTUNITIES","CALLS","DERIVATIVES","FLOW & TECHNICAL","ALERTS","JOURNAL & AUDIT","SYSTEM"];
let state={status:null,active:"COMMAND",call:null,chain:null,chart:null,replay:null,lastFetchMs:null,lastAlertEpoch:0,alertItems:[],alertsEnabled:false,audioCtx:null,swReg:null};
const $=s=>document.querySelector(s);const esc=v=>String(v??"—").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));const n=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):"—";const cls=v=>Number(v)>=0?"pos":"neg";
function tabs(){let x=(state.status||{}).ui_workspaces||[];return x.length?x.map(v=>v.label):DEFAULT_TABS}function ws(k){return (((state.status||{}).workspaces||{})[k]||{})}function rows(){return (((state.status||{}).radar||{}).candidates)||[]}
function card(label,val,sub="",span="card"){return `<section class="${span}"><div class="label">${esc(label)}</div><div class="metric">${esc(val)}</div>${sub?`<div class="sub">${sub}</div>`:""}</section>`}function title(t,tag=""){return `<div class="section-title"><h2>${esc(t)}</h2>${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>`}function empty(t){return `<div class="empty">${esc(t)}</div>`}function truth(){return `<div class="truth">Autonomous discovery stays broad; CALL ENGINE stays strict. WAIT and DO NOT CHASE are valid outputs. Missing/stale evidence stays visible and is never fabricated as LIVE.</div>`}
function candidateTable(list,limit=40){let r=(list||[]).slice(0,limit);if(!r.length)return empty('No matching live candidates.');return `<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Stage</th><th>Move</th><th>Score</th><th>LTP</th><th>Change</th><th>Scouts</th><th>Hot Burst</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td><span class="stage">${esc(x.stage)}</span></td><td>${esc(x.move_class)}</td><td><b>${n(x.score)}</b></td><td>${n(x.ltp,2)}</td><td class="${cls(x.change_pct)}">${n(x.change_pct,2)}%</td><td>${esc((x.scout_pack||{}).ready_count)}/7</td><td>${n(x.hot_burst_pct,3)}%</td></tr>`).join('')}</tbody></table></div>`}
function simpleTable(headers,rowsHtml,min="760px"){if(!rowsHtml)return empty('No verified rows available.');return `<div class="tablewrap"><table style="min-width:${min}"><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`}
function actionClass(a){a=String(a||'').toUpperCase();return a.startsWith('BUY')?'buy':a==='WAIT'?'wait':'stop'}
function callCard(c){if(!c)return empty('No call plan available.');let ez=c.entry_zone||{},t=c.targets||{},rr=c.risk_reward||{},g=c.quality_gate||{};let why=(c.why_now||[]).map(x=>`• ${esc(x)}`).join('<br>'),inv=(c.what_invalidates||[]).map(x=>`• ${esc(x)}`).join('<br>');let valid=c.valid_until_epoch?new Date(Number(c.valid_until_epoch)*1000).toLocaleTimeString():"—";return `<div class="call-card"><div class="call-head"><div><div class="label">${esc(c.symbol)} • ${esc(c.stage)} • QUALITY ${n(c.call_quality,1)}/100</div><div class="call-action ${actionClass(c.action)}">${esc(c.action)} <span style="font-size:13px">${c.strike?esc(c.strike):''} ${c.expiry?esc(c.expiry):''}</span></div></div><span class="stage">${esc(c.model_call_state||c.status)}</span></div><div class="call-grid"><div class="call-field"><span>Buy Zone</span><b>${esc(ez.low)} – ${esc(ez.high)}</b></div><div class="call-field"><span>Ideal Entry</span><b>${esc(ez.ideal)}</b></div><div class="call-field"><span>SL / Structural</span><b>${esc(c.sl)} / ${esc(c.structural_sl)}</b></div><div class="call-field"><span>T1 / T2 / T3</span><b>${esc(t.t1)} / ${esc(t.t2)} / ${esc(t.t3)}</b></div><div class="call-field"><span>R:R T1 / T2</span><b>${n(rr.t1,2)} / ${n(rr.t2,2)}</b></div><div class="call-field"><span>Do Not Chase</span><b>${esc(c.do_not_chase_above)}</b></div><div class="call-field"><span>Time Stop</span><b>${esc(c.time_stop_min)} min</b></div><div class="call-field"><span>Valid Until</span><b>${esc(valid)}</b></div><div class="call-field"><span>Scouts</span><b>${esc(c.scout_coverage)}</b></div><div class="call-field"><span>Liquidity</span><b>${esc(c.liquidity_grade)} • ${n(c.liquidity_score)}</b></div><div class="call-field"><span>Spread</span><b>${n(c.spread_pct,3)}%</b></div><div class="call-field"><span>Underlying Trigger</span><b>${esc(c.underlying_trigger)}</b></div></div><div class="call-reasons"><div class="note good"><b>WHY NOW</b><br>${why||'No qualifying evidence yet.'}</div><div class="note bad"><b>INVALIDATES / BLOCKERS</b><br>${inv||esc((c.blocked_by||[]).join(' • ')||'No current blocker')}</div></div><div class="sub">Re-entry: ${esc(c.re_entry)} • Tracking is model-only; it does not imply you actually entered the trade.</div></div>`}
function renderCommand(){let s=state.status||{},c=s.coverage||{},sc=s.continuous_scanner||{},ce=s.automated_call_engine||s.automated_execution||{},auto=(ce.results||[]).find(x=>(x.call||{}).status==='READY')||(ce.results||[])[0],j=s.call_journal||{};return `<div class="grid">${card('Coverage',`${c.universe_covered??0}/${c.universe_expected??0}`,`${n(c.universe_coverage_pct)}% universe`,'card two')}${card('Full Scan',sc.last_scan_age_sec==null?'—':`${n(sc.last_scan_age_sec,1)}s`,`Every ${sc.interval_sec??'—'}s`,'card two')}${card('Hot Lane',sc.hot_symbols??0,`Every ${sc.hot_interval_sec??'—'}s`,'card two')}${card('Early / Late',`${c.moves_detected_early??0}/${c.moves_detected_late??0}`,'Observed detection timing','card two')}${card('Missed',c.moves_completely_missed??0,'Explicit root cause required','card two')}${card('Resolved Calls',j.resolved??0,`T hits ${j.target_hits??0} • SL ${j.sl_hits??0}`,'card two')}<section class="card wide">${title('BEST CURRENT CALL',ce.status||'WARMING')}${auto?callCard(auto.call):empty('No current candidate passes strict call qualification.')}</section><section class="card half">${title('HOT LANE',`${((s.hot_lane)||[]).length} promoted`)}${candidateTable(s.hot_lane||[],18)}</section><section class="card half">${title('BIG MOVE FORMING')}${candidateTable(((s.big_move_capture_engine||{}).candidates)||[],18)}</section><section class="card wide">${truth()}</section></div>`}
function renderMarket(){let m=ws('market'),b=m.breadth||{},sec=m.sectors||[];let gain=simpleTable(['Gainer','Change','Stage','Score'],(m.gainers||[]).slice(0,15).map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td class="pos">${n(x.change_pct,2)}%</td><td>${esc(x.stage)}</td><td>${n(x.score)}</td></tr>`).join(''));let lose=simpleTable(['Loser','Change','Stage','Score'],(m.losers||[]).slice(0,15).map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td class="neg">${n(x.change_pct,2)}%</td><td>${esc(x.stage)}</td><td>${n(x.score)}</td></tr>`).join(''));let sectors=sec.slice(0,30).map(x=>`<tr><td><b>${esc(x.sector)}</b></td><td>${esc(x.symbols)}</td><td>${esc(x.advancers)}/${esc(x.decliners)}</td><td class="${cls(x.avg_change_pct)}">${n(x.avg_change_pct,2)}%</td><td>${n(x.avg_opportunity_score)}</td><td>${esc(x.leader)}</td></tr>`).join('');return `<div class="grid">${card('Advancers',b.advancers??0,'F&O breadth','card third')}${card('Decliners',b.decliners??0,'F&O breadth','card third')}${card('A/D Ratio',b.advance_decline_ratio??'—',`Avg ${n(b.average_change_pct,2)}%`,'card third')}<section class="card wide">${title('INDEX / MARKET BRAIN',m.active_underlying||'LIVE')}<div class="mono">${esc(JSON.stringify({active_underlying:m.active_underlying,spot:m.spot,index_brain:m.index_brain},null,2))}</div></section><section class="card half">${title('TOP GAINERS')}${gain}</section><section class="card half">${title('TOP LOSERS')}${lose}</section><section class="card wide">${title('SECTOR ROTATION',`${sec.length} sectors`)}${simpleTable(['Sector','Symbols','Adv/Dec','Avg Move','Avg Score','Leader'],sectors,'800px')}</section></div>`}
function renderOpportunities(){let o=ws('opportunities');return `<div class="grid"><section class="card wide">${title('HOT LANE — FASTEST PROMOTED',`${(o.hot_lane||[]).length} names`)}${candidateTable(o.hot_lane||[],40)}</section><section class="card half">${title('EARLY BUILD')}${candidateTable(o.early_build||[],35)}</section><section class="card half">${title('TRIGGER QUEUE')}${candidateTable(o.trigger_queue||[],35)}</section><section class="card half">${title('BREAKOUTS')}${candidateTable(o.breakouts||[],25)}</section><section class="card half">${title('REVERSALS')}${candidateTable(o.reversals||[],25)}</section></div>`}
function renderCalls(){let ce=(state.status||{}).automated_call_engine||(state.status||{}).automated_execution||{},res=ce.results||[];return `<div class="grid"><section class="card wide">${title('AUTONOMOUS CALL BOARD',`${res.length} deep-scanned`)}${res.length?res.map(x=>callCard(x.call)).join(''):empty('No candidate currently passes deep-scan qualification.')}</section><section class="card wide">${title('MANUAL CALL INSPECTOR','Uses automated scanner state — does not trigger census')}<div class="controls"><input id="callSymbol" class="input" placeholder="NIFTY50 / BANKNIFTY / F&O symbol"/><button class="btn" onclick="loadCall()">Build Call</button></div><div style="margin-top:10px">${state.call?callCard(state.call.call):''}</div></section><section class="card half">${title('RE-ENTRY / SECOND CHANCE')}${candidateTable((ws('calls').reentry||[]),35)}</section><section class="card half">${title('SUPPLY / DEMAND CONTEXT')}${candidateTable((ws('calls').supply_demand||[]),35)}</section></div>`}
function renderDerivatives(){let d=ws('derivatives'),r=d.rows||[];let body=r.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage)}</td><td>${n(x.oi_score)}</td><td>${esc(x.oi_state)}</td><td>${n(x.delta_oi_pct,2)}</td><td>${n(x.oi_velocity,2)}</td><td>${n(x.option_score)}</td><td>${n(x.premium_response)}</td><td>${n(x.iv,2)}</td><td>${n(x.gamma,4)}</td></tr>`).join('');return `<div class="grid"><section class="card wide">${title('DERIVATIVES BOARD',d.expiry_mode?'EXPIRY MODE':'NORMAL MODE')}${simpleTable(['Symbol','Stage','OI Score','OI State','ΔOI %','OI Velocity','Option Score','Premium Response','IV','Gamma'],body,'1000px')}</section><section class="card wide">${title('VERIFIED OPTION CHAIN')}<div class="controls"><input id="chainSymbol" class="input" placeholder="NIFTY / BANKNIFTY / stock"/><button class="btn" onclick="loadChain()">Load Chain</button></div>${state.chain?`<div class="mono" style="margin-top:10px">${esc(JSON.stringify(state.chain,null,2))}</div>`:''}</section></div>`}
function renderFlowTechnical(){let ft=ws('flow-technical'),f=ft.flow||[],t=ft.technical||[];let fb=f.slice(0,70).map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage)}</td><td>${n(x.volume_score)}</td><td>${n(x.rvol,2)}</td><td>${n(x.order_flow_score)}</td><td>${n(x.pressure,1)}</td><td>${n(x.spread_pct,3)}</td><td>${esc(x.bias)}</td></tr>`).join('');let tb=t.slice(0,70).map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage)}</td><td>${esc(x.pattern)}</td><td>${n(x.pattern_score)}</td><td>${esc(x.breakout)}</td><td>${esc(x.reversal)}</td><td>${esc(x.compression)}</td></tr>`).join('');return `<div class="grid"><section class="card half">${title('FLOW / DEPTH / VOLUME')}${simpleTable(['Symbol','Stage','Vol','RVOL','Flow','Pressure','Spread','Bias'],fb,'780px')}</section><section class="card half">${title('TECHNICAL / PATTERN')}${simpleTable(['Symbol','Stage','Pattern','Score','Breakout','Reversal','Compression'],tb,'760px')}</section><section class="card wide">${title('CHART INTELLIGENCE')}<div class="controls"><input id="chartSymbol" class="input" placeholder="Symbol"/><button class="btn" onclick="loadChart()">Load Chart Intel</button></div>${state.chart?`<div class="mono" style="margin-top:10px">${esc(JSON.stringify(state.chart,null,2))}</div>`:''}</section></div>`}
function alertPermissionState(){if(!('Notification' in window))return'UNSUPPORTED';return Notification.permission.toUpperCase()}function renderAlerts(){let a=ws('alerts'),items=(state.alertItems.length?state.alertItems:(a.items||[])).slice().sort((x,y)=>(Number(y.epoch)||0)-(Number(x.epoch)||0)).slice(0,150),counts=a.counts||{};let body=items.map(x=>`<tr><td><b>${esc(x.priority)}</b></td><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage||x.kind)}</td><td>${esc(x.reason||x.title)}</td><td>${x.epoch?new Date(Number(x.epoch)*1000).toLocaleTimeString():''}</td></tr>`).join('');return `<div class="grid"><section class="card wide">${title('LIVE ALERT CENTER','Server generated')}<div class="controls"><button class="btn" onclick="enableAlerts()">Enable Browser Alerts</button><span class="pill">Permission ${esc(alertPermissionState())}</span><span class="pill">P0 ${esc(counts.P0||0)}</span><span class="pill">P1 ${esc(counts.P1||0)}</span><span class="pill">P2 ${esc(counts.P2||0)}</span><span class="pill">P3 ${esc(counts.P3||0)}</span></div><div class="sub">Scanner generates alerts independently of this page. Closed-app server push requires a separate Web Push subscription backend; this UI does not pretend otherwise.</div><div style="margin-top:10px">${simpleTable(['Priority','Symbol','State','Reason','Time'],body,'760px')}</div></section></div>`}
function renderJournalAudit(){let a=ws('journal-audit'),j=(a.call_journal||{}),m=a.miss_killer||{},p=a.performance||{},sh=a.shadow||{};let probs=(m.repeated_problems||[]).map(x=>`<tr><td>${esc(x.classification)}</td><td>${esc(x.count)}</td></tr>`).join('');let calls=(j.rows||[]).slice(0,60).map(x=>`<tr><td>${x.epoch?new Date(Number(x.epoch)*1000).toLocaleTimeString():''}</td><td><b>${esc(x.symbol)}</b></td><td>${esc(x.action)}</td><td>${esc(x.status)}</td><td>${esc(x.result)}</td><td>${n(x.quality_score)}</td><td>${n(x.max_favorable_pct,2)}%</td><td>${n(x.max_adverse_pct,2)}%</td></tr>`).join('');return `<div class="grid">${card('Resolved Calls',j.resolved??0,'Observed model calls only','card third')}${card('Last 20 Target Hit',j.last20?.target_hit_pct==null?'—':`${n(j.last20.target_hit_pct)}%`,'Historical observation, not forecast','card third')}${card('Shadow Ahead/Behind',`${sh.v74_ahead??0}/${sh.v74_behind??0}`,`${sh.compared??0} same-snapshot compared`,'card third')}<section class="card wide">${title('CALL JOURNAL')}${simpleTable(['Time','Symbol','Action','State','Result','Quality','MFE','MAE'],calls,'900px')}</section><section class="card half">${title('MISS KILLER')}${simpleTable(['Root Cause','Count'],probs,'420px')}<div class="mono" style="margin-top:10px">${esc(JSON.stringify((m.events||[]).slice(0,30),null,2))}</div></section><section class="card half">${title('V73 vs V74 SHADOW')}<div class="mono">${esc(JSON.stringify(sh,null,2))}</div></section><section class="card wide">${title('REPLAY / FORENSICS')}<div class="controls"><input id="replaySymbol" class="input" placeholder="Symbol"/><button class="btn" onclick="loadReplay()">Load Replay</button></div>${state.replay?`<div class="mono" style="margin-top:10px">${esc(JSON.stringify(state.replay,null,2))}</div>`:''}</section></div>`}
function renderSystem(){let s=state.status||{},sc=s.continuous_scanner||{},ce=s.automated_call_engine||s.automated_execution||{},j=s.call_journal||{};return `<div class="grid"><section class="card half">${title('AUTOMATION / WATCHDOG')}<div class="mono">${esc(JSON.stringify({continuous_scanner:sc,call_engine:{status:ce.status,updated_epoch:ce.updated_epoch,interval_sec:ce.interval_sec,max_promoted_per_cycle:ce.max_promoted_per_cycle,automatic_indices:ce.automatic_indices,errors:ce.errors},request_driven_scanning:false},null,2))}</div></section><section class="card half">${title('DATA / STORAGE TRUTH')}<div class="mono">${esc(JSON.stringify({version:s.version,release:s.release,data_status:s.data_status,coverage:s.coverage,data_quality:(ws('system').data_quality||null),journal_storage:j.storage||null},null,2))}</div></section><section class="card wide">${truth()}</section></div>`}
function render(){let a=state.active;let html=a==='COMMAND'?renderCommand():a==='MARKET'?renderMarket():a==='OPPORTUNITIES'?renderOpportunities():a==='CALLS'?renderCalls():a==='DERIVATIVES'?renderDerivatives():a==='FLOW & TECHNICAL'?renderFlowTechnical():a==='ALERTS'?renderAlerts():a==='JOURNAL & AUDIT'?renderJournalAudit():renderSystem();$('#content').innerHTML=html}
function initTabs(){let el=$('#tabs');let ts=tabs();if(!ts.includes(state.active))state.active=ts[0]||'COMMAND';el.innerHTML=ts.map(t=>`<button class="tab ${t===state.active?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');el.onclick=e=>{let b=e.target.closest('.tab');if(!b)return;state.active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();telemetry()}}
async function getJson(url,opt){let t=performance.now();let r=await fetch(url,opt);state.lastFetchMs=performance.now()-t;if(!r.ok){let j=await r.json().catch(()=>({detail:r.statusText}));throw new Error(j.detail||r.statusText)}return r.json()}
async function load(){try{state.status=await getJson('/api/v74/status');let ds=state.status.data_status||'UNAVAILABLE',sc=state.status.continuous_scanner||{},c=state.status.coverage||{};$('#dataPill').textContent=`DATA ${ds}`;$('#dataPill').className=`pill ${ds==='LIVE'?'live':ds==='STALE'?'warn':'bad'}`;$('#scannerPill').textContent=`FULL ${sc.running?'AUTO':'OFF'} ${sc.last_scan_age_sec==null?'':n(sc.last_scan_age_sec,1)+'s'}`;$('#scannerPill').className=`pill ${sc.running&&sc.fresh?'live':sc.running?'warn':'bad'}`;$('#hotPill').textContent=`HOT ${sc.hot_lane_running?'AUTO':'OFF'} ${sc.hot_symbols??0}`;$('#hotPill').className=`pill ${sc.hot_lane_running?'live':'bad'}`;$('#coveragePill').textContent=`COVERAGE ${c.universe_covered??0}/${c.universe_expected??0}`;initTabs();render();telemetry()}catch(e){$('#content').innerHTML=`<div class="grid"><section class="card wide"><div class="error">${esc(e.message)}</div></section></div>`}}
async function loadCall(){let v=$('#callSymbol')?.value?.trim();if(!v)return;try{state.call=await getJson(`/api/v74/call/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}async function loadChain(){let v=$('#chainSymbol')?.value?.trim();if(!v)return;try{state.chain=await getJson(`/api/v74/option-chain/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}async function loadChart(){let v=$('#chartSymbol')?.value?.trim();if(!v)return;try{state.chart=await getJson(`/api/v74/chart/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}async function loadReplay(){let v=$('#replaySymbol')?.value?.trim();if(!v)return;try{state.replay=await getJson(`/api/v74/replay/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}
async function ensureServiceWorker(){if(!('serviceWorker'in navigator))return null;try{state.swReg=state.swReg||await navigator.serviceWorker.register('/sw.js');return state.swReg}catch(e){return null}}async function enableAlerts(){state.alertsEnabled=true;try{if(!state.audioCtx){let AC=window.AudioContext||window.webkitAudioContext;if(AC)state.audioCtx=new AC()}if(state.audioCtx&&state.audioCtx.state==='suspended')await state.audioCtx.resume()}catch(e){}await ensureServiceWorker();if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}render()}
function beep(p){if(!state.audioCtx)return;try{let o=state.audioCtx.createOscillator(),g=state.audioCtx.createGain();o.connect(g);g.connect(state.audioCtx.destination);o.frequency.value=p==='P0'?880:p==='P1'?660:520;g.gain.setValueAtTime(.05,state.audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,state.audioCtx.currentTime+.18);o.start();o.stop(state.audioCtx.currentTime+.2)}catch(e){}}function showToast(x){let el=$('#alertToast');if(!el)return;el.className=`alert-toast ${String(x.priority||'P3').toLowerCase()} show`;$('#alertToastTitle').textContent=`${x.priority||'ALERT'} • ${x.symbol||''} • ${x.stage||x.kind||''}`;$('#alertToastBody').textContent=x.reason||x.title||'New market state';clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),x.priority==='P0'?7000:5000)}async function deliverAlert(x){showToast(x);if(x.priority==='P0'||x.priority==='P1')beep(x.priority);if(!state.alertsEnabled||!('Notification'in window)||Notification.permission!=='granted')return;let opts={body:`${x.stage||x.kind||''} • ${x.reason||x.move_class||''}`,tag:x.id||`${x.symbol}-${x.stage}`,renotify:true,data:{symbol:x.symbol,priority:x.priority}};try{let reg=await ensureServiceWorker();if(reg&&reg.showNotification)await reg.showNotification(`${x.priority} ${x.symbol}`,opts);else new Notification(`${x.priority} ${x.symbol}`,opts)}catch(e){}}
async function pollAlerts(){try{let r=await getJson(`/api/v74/alerts?since_epoch=${encodeURIComponent(state.lastAlertEpoch||0)}&limit=200`),items=r.items||[];if(Number(r.latest_epoch)>Number(state.lastAlertEpoch||0))state.lastAlertEpoch=Number(r.latest_epoch);if(items.length){let m=new Map(state.alertItems.map(x=>[x.id,x]));for(let x of items)m.set(x.id,x);state.alertItems=Array.from(m.values()).sort((a,b)=>(Number(b.epoch)||0)-(Number(a.epoch)||0)).slice(0,200);for(let x of items)if(['P0','P1','P2'].includes(x.priority))deliverAlert(x);if(state.active==='ALERTS')render()}}catch(e){}}
function telemetry(){let payload={fetch_ms:state.lastFetchMs,render_ms:0,tab:state.active};fetch('/api/v74/telemetry/ui',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})}
initTabs();ensureServiceWorker();load();pollAlerts();setInterval(load,4000);setInterval(pollAlerts,1500);
</script>
