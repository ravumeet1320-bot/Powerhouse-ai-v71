<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f8f7ff" />
<title>POWERHOUSE AI V74</title>
<style>
:root{--bg:#f7f8ff;--ink:#142033;--muted:#667085;--line:rgba(70,82,120,.14);--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);--shadow:0 18px 55px rgba(80,91,138,.12);--good:#157347;--warn:#9a6700;--bad:#b42318;--blue:#3b5ccc;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 4%,#e8ecff 0,transparent 32%),radial-gradient(circle at 91% 2%,#ffe8f3 0,transparent 28%),radial-gradient(circle at 80% 80%,#e7fff5 0,transparent 30%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(137,172,255,.08),rgba(255,174,214,.07),rgba(152,236,205,.07));z-index:-1}
.shell{max-width:1680px;margin:auto;padding:14px 14px 80px}.top{position:sticky;top:0;z-index:30;padding-top:max(6px,env(safe-area-inset-top));backdrop-filter:blur(18px)}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:14px 16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#8ea4ff,#f0a6cd,#8de2c0);display:grid;place-items:center;font-weight:900;color:#17214c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.brand h1{font-size:17px;line-height:1.1;margin:0}.brand small{display:block;color:var(--muted);margin-top:4px;font-weight:650}.statusrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:rgba(255,255,255,.76);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.02em}.pill.live{color:var(--good)}.pill.bad{color:var(--bad)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:thin}.tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.74);color:#4c5671;padding:9px 11px;border-radius:13px;font-size:11px;font-weight:850;cursor:pointer;transition:.18s}.tab:hover,.tab.active{transform:translateY(-1px);background:#fff;color:#1d2d66;box-shadow:0 8px 25px rgba(74,87,140,.12)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:8px}.card{grid-column:span 3;background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(16px)}.wide{grid-column:span 12}.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 2}
.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:850}.metric{font-size:29px;font-weight:900;margin-top:6px;line-height:1}.sub{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h2{font-size:15px;margin:0}.section-title .tag{font-size:10px;font-weight:850;color:var(--blue);background:#eef1ff;padding:6px 9px;border-radius:999px}
.tablewrap{overflow:auto;border-radius:15px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:920px;background:rgba(255,255,255,.55)}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);font-size:11px;vertical-align:top}th{position:sticky;top:0;background:#fbfbff;color:#5c6478;font-size:10px;letter-spacing:.04em;text-transform:uppercase;z-index:2}tr:hover td{background:rgba(238,241,255,.6)}
.stage{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;background:#eef1ff;color:#3f55a8}.state-watch{background:#f5f6f8;color:#667085}.state-early{background:#edf4ff;color:#175cd3}.state-pressure{background:#fff7e8;color:#b54708}.state-break{background:#fff0f1;color:#b42318}.state-active{background:#eafbf2;color:#067647}.neg{color:var(--bad)}.pos{color:var(--good)}
.scouts{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:8px}.scout{border:1px solid var(--line);border-radius:15px;padding:10px;background:rgba(255,255,255,.65)}.scout b{display:block;font-size:12px;margin-top:5px}.scout small{color:var(--muted);font-size:9px}.bar{height:5px;background:#eef0f5;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#93a9ff,#e39bc7,#70d3ad);border-radius:999px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.input{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;font:inherit;font-size:12px;outline:none;min-width:160px}.btn{border:0;background:#263b83;color:#fff;padding:10px 13px;border-radius:13px;font-size:11px;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:#344054;border:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hero-field{border:1px solid var(--line);background:rgba(255,255,255,.62);padding:10px;border-radius:14px}.hero-field span{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.hero-field b{display:block;margin-top:5px;font-size:13px}.call{color:var(--good)}.put{color:var(--bad)}.wait{color:var(--warn)}
.truth{border-left:4px solid #8395e9;background:rgba(238,241,255,.72);padding:12px 14px;border-radius:12px;font-size:11px;line-height:1.55;color:#4e5870}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.error{border-left:4px solid var(--bad);background:#fff1f1;padding:12px;border-radius:12px;color:#7a271a;font-size:12px}.goodnote{border-left:4px solid var(--good);background:#ecfdf3;padding:12px;border-radius:12px;color:#05603a;font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;font-size:10px;line-height:1.5;max-height:460px;overflow:auto;background:#f8f9fc;border:1px solid var(--line);padding:12px;border-radius:15px}.footer{margin-top:18px;color:var(--muted);font-size:10px;text-align:center}
@media(max-width:1100px){.card,.third{grid-column:span 6}.two{grid-column:span 4}.scouts{grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.shell{padding:8px 8px 64px}.brandbar{border-radius:18px;padding:11px}.brand small{display:none}.statusrow .pill:nth-child(n+3){display:none}.card,.half,.third,.two{grid-column:span 12}.grid{gap:8px}.scouts{grid-template-columns:repeat(2,1fr)}.hero-grid{grid-template-columns:repeat(2,1fr)}.metric{font-size:25px}.tab{font-size:10px;padding:8px 9px}.card{padding:13px;border-radius:18px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brandbar">
      <div class="brand"><div class="logo">P74</div><div><h1>POWERHOUSE AI V74</h1><small>Maximum Move Capture & Accountability OS</small></div></div>
      <div class="statusrow"><span id="dataPill" class="pill">DATA —</span><span id="coveragePill" class="pill">COVERAGE —</span><span class="pill">READ-ONLY</span><span class="pill">NO AUTO ORDERS</span></div>
    </div>
    <div id="tabs" class="tabs"></div>
  </div>

  <main id="content"></main>
  <div class="footer">100% accountability target • 100% coverage auditing • Zero avoidable misses engineering objective • No guaranteed returns</div>
</div>
<script>
const TABS = ["COMMAND","LIVE MARKET","RADAR","PRE-MOVE","HERO","AUTO TRENDER","BREAKOUT","REVERSAL","SUPPLY-DEMAND","SECTORS","HEATMAP","GAINERS-LOSERS","FAST MOVERS","DERIVATIVES","OPTION CHAIN","OI","FUTURES","GREEKS","IV","EXPIRY","VOLUME","ORDER FLOW","DEPTH","SMART MONEY","CHART","PATTERNS","CANDLESTICKS","VIX","CIRCUITS","ALERTS","RE-ENTRY","MISSED MOVES","REPLAY","PERFORMANCE","SYSTEM"];
let state={status:null,active:"COMMAND",hero:null,extra:null,lastFetchMs:null};
const $=s=>document.querySelector(s); const esc=v=>String(v??"—").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const n=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):"—"; const clsChange=v=>Number(v)>=0?"pos":"neg";
function stageRank(s){return ["DISCOVERY","EARLY CLUE","BUILDING","ACCELERATING","ARMING","TRIGGER NEAR","TRIGGER READY","HERO","ENTRY ACTIVE","T1","T2","T3","RUNNER","EXIT / RE-ENTRY"].indexOf(s)}
function stateClass(s){if(s==="MOVE ACTIVE")return"state-active";if(s==="BREAK IMMINENT")return"state-break";if(s==="PRESSURE RISING")return"state-pressure";if(s==="EARLY BUILD")return"state-early";return"state-watch"}
function card(label,val,sub="",span="card"){return `<section class="${span}"><div class="label">${esc(label)}</div><div class="metric">${esc(val)}</div>${sub?`<div class="sub">${sub}</div>`:""}</section>`}
function title(t,tag=""){return `<div class="section-title"><h2>${esc(t)}</h2>${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>`}
function truth(){return `<div class="truth">V74 treats 100% movement capture as an engineering coverage target, not a profitability promise. Missing/stale evidence stays visible; opportunity discovery is broad, Hero qualification is strict.</div>`}
function rows(){return (((state.status||{}).radar||{}).candidates)||[]}
function candidateTable(list=rows(),limit=80){let r=list.slice(0,limit);if(!r.length)return `<div class="empty">No truthful live candidates available yet.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Stage</th><th>Move</th><th>Big Move</th><th>Score</th><th>LTP</th><th>Change</th><th>Scouts</th><th>Pattern</th><th>Sector</th><th>Second Chance</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td><span class="stage">${esc(x.stage)}</span></td><td>${esc(x.move_class)}</td><td><span class="stage ${stateClass(x.big_move_state)}">${esc(x.big_move_state)}</span></td><td><b>${n(x.score)}</b></td><td>${n(x.ltp,2)}</td><td class="${clsChange(x.change_pct)}">${n(x.change_pct,2)}%</td><td>${esc((x.scout_pack||{}).ready_count)}/7</td><td>${esc(x.pattern)}</td><td>${esc(x.sector)}</td><td>${esc((x.second_chance||[]).join(" • "))}</td></tr>`).join("")}</tbody></table></div>`}
function scoutPanel(c){let sp=(c||{}).scout_pack||{}, ss=sp.scouts||{};return `<div class="scouts">${["price","volume","oi","sector","order_flow","pattern","options"].map(k=>{let x=ss[k]||{},score=x.score;return `<div class="scout"><small>${esc(k.replace('_',' ').toUpperCase())}</small><b>${x.status==="READY"?n(score):"UNAVAILABLE"}</b><div class="bar"><i style="width:${Number(score)||0}%"></i></div></div>`}).join("")}</div>`}
function renderCommand(){let s=state.status||{},c=s.coverage||{},big=((s.big_move_capture_engine||{}).candidates)||[],best=big[0]||rows()[0];return `<div class="grid">${card("Universe Coverage",`${c.universe_covered??0}/${c.universe_expected??0}`,`${n(c.universe_coverage_pct)}% accounted`,"card two")}${card("Fresh Quotes",c.fresh_quotes??0,"Quote truth ≤ freshness guard","card two")}${card("Symbols Scanned",c.symbols_scanned??0,"Whole F&O coverage sentinel","card two")}${card("Moves Early",c.moves_detected_early??0,"Detected before meaningful-move event","card two")}${card("Moves Late",c.moves_detected_late??0,"Detected after move onset","card two")}${card("Completely Missed",c.moves_completely_missed??0,"Must have explicit root cause","card two")}
<section class="card wide">${title("BIG MOVE FORMING","Engine 5.0")}${best?`<div class="hero-grid"><div class="hero-field"><span>Symbol</span><b>${esc(best.symbol)}</b></div><div class="hero-field"><span>State</span><b>${esc(best.big_move_state)}</b></div><div class="hero-field"><span>Lifecycle</span><b>${esc(best.stage)}</b></div><div class="hero-field"><span>Move class</span><b>${esc(best.move_class)}</b></div></div><div style="margin-top:12px">${scoutPanel(best)}</div>`:`<div class="empty">Waiting for live F&O evidence.</div>`}</section>
<section class="card wide">${title("Priority Radar",`${rows().length} tracked`)}${candidateTable(rows(),25)}</section><section class="card wide">${truth()}</section></div>`}
function renderLive(){let r=[...rows()].sort((a,b)=>Math.abs(Number(b.change_pct)||0)-Math.abs(Number(a.change_pct)||0));return `<div class="grid"><section class="card wide">${title("LIVE MARKET — Truthful F&O Census","No mock fill")}${candidateTable(r,120)}</section></div>`}
function renderRadar(filter){let r=rows();if(filter)r=r.filter(filter);return `<div class="grid"><section class="card wide">${title(state.active,`${r.length} matches`)}${candidateTable(r,150)}</section></div>`}
function renderHero(){let h=state.hero&&state.hero.hero5;return `<div class="grid"><section class="card wide">${title("HERO 5.0 — Exact Execution Plan","Strict qualification")}<div class="controls"><input id="heroSymbol" class="input" placeholder="F&O symbol e.g. RELIANCE"/><button class="btn" onclick="loadHero()">Build Hero</button></div>${!h?`<div class="empty">Enter a live F&O symbol. No Hero is emitted without option-chain + liquidity + risk evidence.</div>`:`<div style="margin-top:14px"><div class="hero-grid"><div class="hero-field"><span>CALL / PUT / WAIT</span><b class="${String(h.action||'wait').toLowerCase()}">${esc(h.action)}</b></div><div class="hero-field"><span>Strike</span><b>${esc(h.strike)}</b></div><div class="hero-field"><span>Expiry</span><b>${esc(h.expiry)}</b></div><div class="hero-field"><span>Premium</span><b>${esc(h.premium)}</b></div><div class="hero-field"><span>Entry Low</span><b>${esc(h.entry_low)}</b></div><div class="hero-field"><span>Ideal Entry</span><b>${esc(h.ideal_entry)}</b></div><div class="hero-field"><span>Entry High</span><b>${esc(h.entry_high)}</b></div><div class="hero-field"><span>Do Not Chase</span><b>${esc(h.do_not_chase)}</b></div><div class="hero-field"><span>SL</span><b>${esc(h.sl)}</b></div><div class="hero-field"><span>Structural SL</span><b>${esc(h.structural_sl)}</b></div><div class="hero-field"><span>Time Stop</span><b>${esc(h.time_stop_min)} min</b></div><div class="hero-field"><span>T1 / T2 / T3</span><b>${esc(h.t1)} / ${esc(h.t2)} / ${esc(h.t3)}</b></div><div class="hero-field"><span>Extended</span><b>${esc(h.extended_target)}</b></div><div class="hero-field"><span>Liquidity Grade</span><b>${esc(h.liquidity_grade)}</b></div><div class="hero-field"><span>Spread</span><b>${esc(h.spread_pct)}%</b></div><div class="hero-field"><span>VIX Regime</span><b>${esc(h.vix_regime)}</b></div></div><div style="margin-top:12px" class="${(h.blocked_by||[]).length?'error':'goodnote'}"><b>${(h.blocked_by||[]).length?'BLOCKED':'QUALIFIED'}</b> ${(h.blocked_by||[]).join(' • ')||'No mandatory blocker active.'}</div><div class="grid" style="margin-top:0"><div class="card third">${title('Why Now')}<div class="sub">${esc((h.why_now||[]).join(' • '))}</div></div><div class="card third">${title('Why This Strike')}<div class="sub">${esc((h.why_this_strike||[]).join(' • '))}</div></div><div class="card third">${title('What Invalidates')}<div class="sub">${esc((h.what_invalidates||[]).join(' • '))}</div></div></div></div>`}</section></div>`}
function renderDeriv(kind){let r=rows();let col={"OI":"oi","IV":"options","GREEKS":"options","FUTURES":"oi","DERIVATIVES":"options"}[kind]||"options";return `<div class="grid"><section class="card wide">${title(kind,"Evidence only when supplied")}<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Stage</th><th>Scout</th><th>Score</th><th>Evidence</th></tr></thead><tbody>${r.slice(0,120).map(x=>{let z=(((x.scout_pack||{}).scouts)||{})[col]||{};return `<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage)}</td><td>${esc(z.status)}</td><td>${esc(z.score)}</td><td><span class="mono" style="display:block;max-height:80px">${esc(JSON.stringify(z))}</span></td></tr>`}).join('')}</tbody></table></div></section></div>`}
function renderMicroEvidence(kind){let map={"VOLUME":"volume","ORDER FLOW":"order_flow","DEPTH":"order_flow","PATTERNS":"pattern","CANDLESTICKS":"pattern","SECTORS":"sector","SMART MONEY":"order_flow"};let key=map[kind]||"price";return `<div class="grid"><section class="card wide">${title(kind,"7-scout context")}<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Stage</th><th>Move</th><th>Score</th><th>${esc(kind)} evidence</th></tr></thead><tbody>${rows().slice(0,140).map(x=>{let z=(((x.scout_pack||{}).scouts)||{})[key]||{};return `<tr><td><b>${esc(x.symbol)}</b></td><td>${esc(x.stage)}</td><td>${esc(x.move_class)}</td><td>${esc(z.score)}</td><td><span class="mono" style="display:block;max-height:80px">${esc(JSON.stringify(z))}</span></td></tr>`}).join('')}</tbody></table></div></section></div>`}
function renderMiss(){let m=(state.status||{}).miss_killer||{};return `<div class="grid">${Object.entries(m.counts||{}).filter(([,v])=>v).map(([k,v])=>card(k,v,"Root-cause events","card third")).join('')}<section class="card wide">${title("MISS KILLER 2.0","Silent miss forbidden")}<div class="sub">Allowed classifications: ${esc((m.allowed_classifications||[]).join(' • '))}</div><div class="mono" style="margin-top:12px">${esc(JSON.stringify(m.events||[],null,2))}</div></section></div>`}
function renderPerformance(){let p=(state.status||{}).performance_intelligence||{};let list=p.pattern_records||[];return `<div class="grid">${card("Tracked Setups",(p.overall||{}).tracked_setups??0,"Observed V74 candidates","card third")}${card("Meaningful Moves",(p.overall||{}).meaningful_moves??0,"Observed events","card third")}${card("Median Lead Time",`${n((p.overall||{}).median_lead_time_sec,1)}s`,`Descriptive, not predictive`,"card third")}<section class="card wide">${title("Profitability Intelligence","Observed records only")}<div class="tablewrap"><table><thead><tr><th>Pattern</th><th>Sample</th><th>Follow-through</th><th>Median MFE</th><th>Median MAE</th><th>Probability</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.pattern)}</td><td>${esc(x.sample_size)}</td><td>${esc(x.observed_follow_through_pct)}%</td><td>${esc(x.median_mfe_pct)}%</td><td>${esc(x.median_mae_pct)}%</td><td>Not claimed</td></tr>`).join('')}</tbody></table></div></section></div>`}
function renderReplay(){return `<div class="grid"><section class="card wide">${title("REPLAY — No Look-Ahead Forensics")}<div class="controls"><input id="replaySymbol" class="input" placeholder="Symbol"/><button class="btn" onclick="loadReplay()">Load Replay</button></div>${state.extra?`<div class="mono" style="margin-top:12px">${esc(JSON.stringify(state.extra,null,2))}</div>`:`<div class="empty">Enter a symbol to inspect the existing V72 replay timeline through V74.</div>`}</section></div>`}
function renderOptionChain(){return `<div class="grid"><section class="card wide">${title("OPTION CHAIN","On-demand, no fake chain")}<div class="controls"><input id="chainSymbol" class="input" placeholder="F&O symbol"/><button class="btn" onclick="loadChain()">Fetch Live Chain</button></div>${state.extra?`<div class="mono" style="margin-top:12px">${esc(JSON.stringify(state.extra,null,2))}</div>`:`<div class="empty">Option chain is fetched only from the authenticated provider.</div>`}</section></div>`}
function renderChart(){return `<div class="grid"><section class="card wide">${title("CHART SUPER ENGINE","Supply/Demand • VWAP • AVWAP • EMA • VP • OI Walls • Hero levels")}<div class="controls"><input id="chartSymbol" class="input" placeholder="F&O symbol"/><button class="btn" onclick="loadChart()">Load Intelligence</button></div>${state.extra?`<div class="mono" style="margin-top:12px">${esc(JSON.stringify(state.extra,null,2))}</div>`:`<div class="empty">On-demand chart intelligence preserves existing V72/V73 calculation paths.</div>`}</section></div>`}
function renderSystem(){let s=state.status||{};return `<div class="grid"><section class="card half">${title("SYSTEM TRUTH")}<div class="mono">${esc(JSON.stringify({version:s.version,release:s.release,data_status:s.data_status,coverage:s.coverage,performance:s.performance,truth_policy:s.truth_policy},null,2))}</div></section><section class="card half">${title("Session / Expiry Brain")}<div class="mono">${esc(JSON.stringify(s.session_brain||{},null,2))}</div></section><section class="card wide">${truth()}</section></div>`}
function render(){let a=state.active;let html;if(a==="COMMAND")html=renderCommand();else if(a==="LIVE MARKET")html=renderLive();else if(a==="RADAR")html=renderRadar();else if(a==="PRE-MOVE")html=renderRadar(x=>stageRank(x.stage)<=6);else if(a==="HERO")html=renderHero();else if(a==="AUTO TRENDER")html=renderRadar(x=>x.stage==="ACCELERATING"||x.stage==="ARMING"||x.stage==="TRIGGER NEAR");else if(a==="BREAKOUT")html=renderRadar(x=>x.move_class==="BREAKOUT MOVE"||String(x.pattern||'').toUpperCase().includes('BREAK'));else if(a==="REVERSAL")html=renderRadar(x=>x.move_class==="REVERSAL MOVE"||String(x.pattern||'').toUpperCase().includes('REVERS'));else if(a==="SUPPLY-DEMAND")html=renderRadar(x=>x.supply_demand);else if(a==="HEATMAP")html=renderRadar();else if(a==="GAINERS-LOSERS")html=renderLive();else if(a==="FAST MOVERS")html=renderRadar(x=>Number((((x.scout_pack||{}).scouts||{}).price||{}).score)>=60);else if(["DERIVATIVES","OI","FUTURES","GREEKS","IV"].includes(a))html=renderDeriv(a);else if(a==="OPTION CHAIN")html=renderOptionChain();else if(a==="EXPIRY")html=renderSystem();else if(["VOLUME","ORDER FLOW","DEPTH","SMART MONEY","PATTERNS","CANDLESTICKS","SECTORS"].includes(a))html=renderMicroEvidence(a);else if(a==="CHART")html=renderChart();else if(a==="VIX")html=renderSystem();else if(a==="CIRCUITS"){let c=(state.status||{}).circuits||{};html=`<div class="grid"><section class="card wide">${title('CIRCUITS',`${(c.candidates||[]).length||0} candidates`)}<div class="mono">${esc(JSON.stringify(c,null,2))}</div></section></div>`}else if(a==="ALERTS"){let c=(state.status||{}).alerts||{};html=`<div class="grid"><section class="card wide">${title('ALERTS','P0–P3 evidence priorities')}<div class="mono">${esc(JSON.stringify(c,null,2))}</div></section></div>`}else if(a==="RE-ENTRY")html=renderRadar(x=>(x.second_chance||[]).length);else if(a==="MISSED MOVES")html=renderMiss();else if(a==="REPLAY")html=renderReplay();else if(a==="PERFORMANCE")html=renderPerformance();else html=renderSystem();$("#content").innerHTML=html;}
function initTabs(){let el=$("#tabs");el.innerHTML=TABS.map(t=>`<button class="tab ${t===state.active?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');el.addEventListener('click',e=>{let b=e.target.closest('.tab');if(!b)return;state.active=b.dataset.tab;state.extra=null;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();telemetry();});}
async function getJson(url,opt){let t=performance.now();let r=await fetch(url,opt);let fetchMs=performance.now()-t;state.lastFetchMs=fetchMs;if(!r.ok){let j=await r.json().catch(()=>({detail:r.statusText}));throw new Error(j.detail||r.statusText)}return r.json()}
async function load(){try{state.status=await getJson('/api/v74/status');let ds=state.status.data_status||'UNAVAILABLE';$("#dataPill").textContent=`DATA ${ds}`;$("#dataPill").className=`pill ${ds==='LIVE'?'live':'bad'}`;let c=state.status.coverage||{};$("#coveragePill").textContent=`COVERAGE ${c.universe_covered??0}/${c.universe_expected??0}`;$("#coveragePill").className='pill';render();telemetry()}catch(e){$("#content").innerHTML=`<div class="grid"><section class="card wide"><div class="error">${esc(e.message)}</div></section></div>`}}
async function loadHero(){let v=$("#heroSymbol")?.value?.trim();if(!v)return;try{state.hero=await getJson(`/api/v74/hero/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}
async function loadReplay(){let v=$("#replaySymbol")?.value?.trim();if(!v)return;try{state.extra=await getJson(`/api/v74/replay/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}
async function loadChain(){let v=$("#chainSymbol")?.value?.trim();if(!v)return;try{state.extra=await getJson(`/api/v74/option-chain/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}
async function loadChart(){let v=$("#chartSymbol")?.value?.trim();if(!v)return;try{state.extra=await getJson(`/api/v74/chart/${encodeURIComponent(v)}`);render()}catch(e){alert(e.message)}}
function telemetry(){let payload={fetch_ms:state.lastFetchMs,render_ms:0,tab:state.active};fetch('/api/v74/telemetry/ui',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});}
initTabs();load();setInterval(load,15000);
</script>
</body>
</html>
