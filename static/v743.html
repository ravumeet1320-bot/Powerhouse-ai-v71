<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f7f8ff" />
<link rel="manifest" href="/static/manifest.webmanifest" />
<title>POWERHOUSE AI V74.3 — Pro Ultra Accuracy</title>
<style>
:root{--bg:#f6f7fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--card:rgba(255,255,255,.92);--good:#067647;--warn:#b54708;--bad:#b42318;--blue:#3538cd;--violet:#6938ef;--shadow:0 16px 44px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,#e8ebff 0,transparent 31%),radial-gradient(circle at 92% 2%,#ffe8f3 0,transparent 28%),var(--bg);color:var(--ink)}.shell{max-width:1700px;margin:auto;padding:12px 12px 70px}.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.74);backdrop-filter:blur(16px);padding-top:max(4px,env(safe-area-inset-top))}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#94a6ff,#e8a8d0,#9be6c5);display:grid;place-items:center;font-weight:950}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);margin-top:4px;font-weight:650}.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 2px}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#475467;border-radius:12px;padding:8px 11px;font-size:10px;font-weight:850;cursor:pointer}.tab.active{color:#fff;background:#344054}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;grid-column:span 3}.wide{grid-column:span 12}.half{grid-column:span 6}.third{grid-column:span 4}.label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:850}.metric{font-size:26px;font-weight:950;margin-top:5px}.sub{font-size:10px;line-height:1.5;color:var(--muted);margin-top:6px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.title h2{font-size:14px;margin:0}.tag{font-size:8px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3538cd}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:920px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:10px;text-align:left;vertical-align:top}th{font-size:9px;color:#667085;text-transform:uppercase;letter-spacing:.03em;background:#f9fafb;position:sticky;top:0}.stage{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#3538cd;font-size:8px;font-weight:900}.take{background:#ecfdf3;color:#067647}.skip{background:#fff4ed;color:#b54708}.block{background:#fef3f2;color:#b42318}.call{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}.callhead{display:flex;justify-content:space-between;gap:8px}.action{font-size:20px;font-weight:950}.callgrid{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:7px;margin-top:10px}.field{border:1px solid var(--line);border-radius:11px;background:#f9fafb;padding:8px}.field span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:800}.field b{display:block;margin-top:4px;font-size:11px}.note{border-left:4px solid #8098f9;background:#f4f6ff;padding:10px;border-radius:10px;font-size:10px;line-height:1.5;margin-top:9px}.note.warn{border-color:#f79009;background:#fff8eb}.note.bad{border-color:#f04438;background:#fff3f2}.btn{border:0;border-radius:11px;background:#344054;color:white;padding:9px 12px;font-size:10px;font-weight:850;cursor:pointer}.btn.alt{background:#fff;color:#344054;border:1px solid var(--line)}.controls{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:24px;color:var(--muted);font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:9px;max-height:440px;overflow:auto}.footer{text-align:center;color:var(--muted);font-size:9px;margin-top:20px}@media(max-width:1000px){.card,.third{grid-column:span 6}.callgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{padding:8px 8px 60px}.brand small{display:none}.card,.half,.third{grid-column:span 12}.callgrid{grid-template-columns:repeat(2,1fr)}.pills .pill:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div class="shell">
<div class="top">
  <div class="bar">
    <div class="brand"><div class="logo">P43</div><div><h1>POWERHOUSE AI V74.3</h1><small>Pro Ultra Accuracy • India Market • Read-Only Intelligence</small></div></div>
    <div class="pills"><span id="feed" class="pill">FEED —</span><span id="scan" class="pill">SCANNER —</span><span id="safe" class="pill">SAFE —</span><span id="store" class="pill">STORE —</span><span id="push" class="pill">PUSH —</span><span class="pill">NO ORDERS</span></div>
  </div>
  <div id="tabs" class="tabs"></div>
</div>
<main id="content"></main>
<div class="footer">Ultra Accuracy uses TAKE / SKIP / INSUFFICIENT DATA. Meta score is evidence quality, not guaranteed win probability.</div>
</div>
<script>
const TABS=['COMMAND','ULTRA CALLS','DISCOVERY','ACCURACY','ALERTS','AUDIT','SYSTEM'];
let S={tab:'COMMAND',pro:null,base:null,precision:null,accuracy:null,decisions:null,sla:null,calls:null,alerts:null};
const $=q=>document.querySelector(q), e=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), n=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
function card(l,v,s=''){return `<section class="card"><div class="label">${e(l)}</div><div class="metric">${e(v)}</div>${s?`<div class="sub">${s}</div>`:''}</section>`}function title(t,tag=''){return `<div class="title"><h2>${e(t)}</h2>${tag?`<span class="tag">${e(tag)}</span>`:''}</div>`}function pill(id,text,cls=''){let x=$('#'+id);if(x){x.textContent=text;x.className='pill '+cls}}
async function j(url,opt){let r=await fetch(url,{cache:'no-store',...(opt||{})});let t=await r.text();if(!r.ok)throw new Error(t||r.status);return JSON.parse(t)}
function calls(){return (S.precision||{}).results||[]}function candidates(){return ((((S.base||{}).radar)||{}).candidates)||[]}
function callCard(x){let c=x.call||{},u=c.ultra_accuracy||{},z=c.entry_zone||{},t=c.targets||{},b=[...(u.hard_blockers||[]),...(u.insufficient||[])];return `<div class="call"><div class="callhead"><div><div class="label">${e(x.symbol)} • ${e(c.stage)} • META ${n(c.meta_score)}</div><div class="action ${c.meta_label==='TAKE'?'good':'warn'}">${e(c.action)} ${c.strike?e(c.strike):''}</div></div><span class="stage ${c.meta_label==='TAKE'?'take':'skip'}">${e(c.meta_label||'WAIT')}</span></div><div class="callgrid"><div class="field"><span>Entry Zone</span><b>${e(z.low)} – ${e(z.high)}</b></div><div class="field"><span>Ideal</span><b>${e(z.ideal)}</b></div><div class="field"><span>SL / Structural</span><b>${e(c.sl)} / ${e(c.structural_sl)}</b></div><div class="field"><span>T1 / T2 / T3</span><b>${e(t.t1)} / ${e(t.t2)} / ${e(t.t3)}</b></div><div class="field"><span>Base / Meta</span><b>${n(c.call_quality)} / ${n(c.meta_score)}</b></div><div class="field"><span>Disagreement</span><b>${n(u.disagreement)}</b></div><div class="field"><span>Liquidity</span><b>${n(u.liquidity)}</b></div><div class="field"><span>Spread</span><b>${n(u.spread_pct,3)}%</b></div><div class="field"><span>R:R T1</span><b>${n(u.rr_t1,2)}</b></div><div class="field"><span>Scouts</span><b>${e(u.ready_scouts)}/7</b></div><div class="field"><span>Freshness</span><b>${n(u.quote_age_sec,2)}s</b></div><div class="field"><span>Config</span><b>${e(c.config_hash)}</b></div></div>${b.length?`<div class="note warn"><b>WHY NOT TAKE</b><br>${b.map(v=>'• '+e(v)).join('<br>')}</div>`:`<div class="note"><b>ULTRA ACCURACY PASSED</b><br>${(c.why_now||[]).slice(0,5).map(v=>'• '+e(v)).join('<br>')}</div>`}</div>`}
function tableCand(list){let r=(list||[]).slice(0,70);if(!r.length)return '<div class="empty">No live candidates.</div>';return `<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Stage</th><th>Move</th><th>Score</th><th>Change</th><th>Scouts</th><th>Fresh</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${e(x.symbol)}</b></td><td><span class="stage">${e(x.stage)}</span></td><td>${e(x.move_class)}</td><td>${n(x.score)}</td><td>${n(x.change_pct,2)}%</td><td>${e((x.scout_pack||{}).ready_count)}/7</td><td>${e(((x.data_truth||{}).fresh))}</td></tr>`).join('')}</tbody></table></div>`}
function render(){let h='';if(S.tab==='COMMAND'){let p=S.pro||{},a=S.accuracy||{},b=(S.base||{}).coverage||{};h=`<div class="grid">${card('Ultra Accuracy',p.engine||'—','Default actionable gate')}${card('TAKE Calls',(S.precision||{}).take_count??'—','Only TAKE is actionable')}${card('Abstained',(S.precision||{}).abstain_count??'—','SKIP + insufficient data')}${card('Resolved Precision',a.execution_adjusted_precision_proxy_pct==null?'INSUFFICIENT DATA':a.execution_adjusted_precision_proxy_pct+'%','Observed resolved TAKE calls only')}${card('Universe',b.symbols_scanned??'—','Server-side scanner')}${card('Early Moves',b.moves_detected_early??'—','Observed discovery telemetry')}${card('Misses',b.moves_completely_missed??'—','Explicit miss accounting')}${card('Config Hash',p.config_hash||'—','Reproducible decision config')}<section class="card wide">${title('Current Ultra Accuracy Calls','PRECISION-FIRST')}${calls().map(callCard).join('')||'<div class="empty">No qualified calls right now. WAIT is valid.</div>'}</section></div>`}
else if(S.tab==='ULTRA CALLS'){h=`<div class="grid"><section class="card wide">${title('Actionable + Abstained Call Board','TAKE / SKIP')}${calls().map(callCard).join('')||'<div class="empty">No deep-scan calls yet.</div>'}</section></div>`}
else if(S.tab==='DISCOVERY'){h=`<div class="grid"><section class="card wide">${title('Broad Discovery Radar','NOT AUTOMATIC CALLS')}${tableCand(candidates())}</section></div>`}
else if(S.tab==='ACCURACY'){let a=S.accuracy||{},c=a.calibration||{};h=`<div class="grid">${card('Decisions',a.decisions??'—')}${card('TAKE',a.take??'—')}${card('Abstained',a.abstained??'—')}${card('Resolved TAKE',a.resolved_take??'—')}${card('Target First',a.target_first??'—')}${card('Stop First',a.stop_first??'—')}${card('Calibration',c.status||'—',`Minimum sample ${e(c.minimum_sample)}`)}${card('Posterior Mean',c.posterior_mean==null?'HIDDEN':n(c.posterior_mean*100,1)+'%','Shown only after minimum resolved sample')}<section class="card wide"><div class="note">${e(a.truth||'Accuracy is measured only from live resolved calls. No fixed win-rate is promised.')}</div></section></div>`}
else if(S.tab==='ALERTS'){let items=((S.alerts||{}).items)||[];h=`<div class="grid"><section class="card wide">${title('Server Alerts','P0 / P1 / P2 / P3')}<div class="tablewrap"><table><thead><tr><th>Time</th><th>Priority</th><th>Symbol</th><th>Kind</th><th>Reason</th></tr></thead><tbody>${items.slice().reverse().slice(0,100).map(x=>`<tr><td>${new Date((x.epoch||0)*1000).toLocaleTimeString()}</td><td>${e(x.priority)}</td><td><b>${e(x.symbol)}</b></td><td>${e(x.kind)}</td><td>${e(x.reason)}</td></tr>`).join('')}</tbody></table></div></section></div>`}
else if(S.tab==='AUDIT'){let d=((S.decisions||{}).rows)||[];h=`<div class="grid"><section class="card wide">${title('Immutable Decision Audit','SNAPSHOT HASH + CONFIG HASH')}<div class="tablewrap"><table><thead><tr><th>Time</th><th>Symbol</th><th>Decision</th><th>Action</th><th>Meta</th><th>Disagree</th><th>Outcome</th><th>Config</th></tr></thead><tbody>${d.slice(0,200).map(x=>`<tr><td>${new Date((x.epoch||0)*1000).toLocaleString()}</td><td><b>${e(x.symbol)}</b></td><td><span class="stage ${x.decision==='TAKE'?'take':'skip'}">${e(x.decision)}</span></td><td>${e(x.final_action)}</td><td>${n(x.meta_score)}</td><td>${n(x.disagreement)}</td><td>${e(x.outcome)}</td><td>${e(x.config_hash)}</td></tr>`).join('')}</tbody></table></div></section></div>`}
else{let s=S.sla||{},hb=((s.heartbeats||{}).subsystems)||[];h=`<div class="grid">${card('System State',(s.heartbeats||{}).system_state||'—')}${card('Store',(s.storage||{}).backend||'—',(s.storage||{}).durable?'Durable':'Fallback / ephemeral risk')}${card('Push',(s.push||{}).configured?'CONFIGURED':'NOT CONFIGURED')}${card('Scanner',(s.scanner||{}).fresh?'FRESH':'STALE',`Age ${e((s.scanner||{}).last_scan_age_sec)}s`)}<section class="card wide">${title('Subsystem Heartbeats','FAIL-CLOSED')}<div class="tablewrap"><table><thead><tr><th>Subsystem</th><th>Status</th><th>Age</th><th>Latency</th><th>Details</th></tr></thead><tbody>${hb.map(x=>`<tr><td><b>${e(x.subsystem)}</b></td><td>${e(x.status)}</td><td>${n(x.age_sec,1)}s</td><td>${n(x.latency_ms,1)}ms</td><td>${e(JSON.stringify(x.details||{}))}</td></tr>`).join('')}</tbody></table></div><div class="controls" style="margin-top:10px"><button class="btn" onclick="enablePush()">Enable Closed-App Push</button><button class="btn alt" onclick="refresh()">Refresh</button></div></section></div>`}$('#content').innerHTML=h}
function tabbar(){let el=$('#tabs');el.innerHTML=TABS.map(t=>`<button class="tab ${S.tab===t?'active':''}" onclick="S.tab='${t}';tabbar();render()">${t}</button>`).join('')}
async function refresh(){try{let [pro,base,precision,accuracy,decisions,sla,calls,alerts]=await Promise.all([j('/api/v74.3/status'),j('/api/v74/status'),j('/api/v74.3/precision'),j('/api/v74.3/accuracy'),j('/api/v74.3/decisions?limit=250'),j('/api/v74.3/sla'),j('/api/v74/calls'),j('/api/v74/alerts?limit=120')]);S.pro=pro.precision;S.base=base;S.precision=precision;S.accuracy=accuracy;S.decisions=decisions;S.sla=sla;S.calls=calls;S.alerts=alerts;let sc=sla.scanner||{},sf=sla.safe_mode||{},st=sla.storage||{},pu=sla.push||{};pill('feed','FEED '+(base.data_status||'—'),base.data_status==='LIVE'?'good':'warn');pill('scan','SCANNER '+(sc.fresh?'FRESH':'STALE'),sc.fresh?'good':'bad');pill('safe','SAFE '+(sf.enabled?'ON':'OFF'),sf.enabled?'bad':'good');pill('store','STORE '+(st.backend||'—'),st.durable?'good':'warn');pill('push','PUSH '+(pu.configured?'READY':'OFF'),pu.configured?'good':'warn');render()}catch(err){console.error(err);pill('feed','LOAD ERROR','bad');$('#content').innerHTML=`<div class="note bad">${e(err.message)}</div>`}}
function b64ToU8(s){let p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('Web Push not supported in this browser');let k=await j('/api/v74.3/push/public-key');if(!k.configured||!k.public_key)throw new Error('Server VAPID keys are not configured yet');let reg=await navigator.serviceWorker.register('/static/sw.js',{scope:'/'});let perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission not granted');let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(k.public_key)});await j('/api/v74.3/push/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),label:navigator.userAgent})});alert('Closed-app push enabled for this device.');refresh()}catch(err){alert(err.message)}}
tabbar();refresh();setInterval(refresh,5000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/sw.js',{scope:'/'}).catch(()=>{});
</script>
</body>
</html>
