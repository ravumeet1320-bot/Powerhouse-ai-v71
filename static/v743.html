function drawPrice(){let c=$('#priceChart'),[ctx,w,h]=canvasSize(c),cand=normalizeCandles((S.chart||{}).candles);ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(80,150,200,.15)';ctx.lineWidth=1;for(let i=0;i<6;i++){let y=10+i*(h-20)/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(!cand.length){ctx.fillStyle='rgba(127,165,198,.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('Waiting for live candle data — no demo values substituted',w/2,h/2);return}cand=cand.slice(-100);let min=Math.min(...cand.map(x=>x.l)),max=Math.max(...cand.map(x=>x.h)),pad=(max-min)*.08||1;min-=pad;max+=pad;let xstep=w/cand.length;const y=v=>h-10-(v-min)/(max-min)*(h-20);cand.forEach((x,i)=>{let X=i*xstep+xstep/2,up=x.c>=x.o,col=up?'#05e89a':'#ff4269';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X,y(x.h));ctx.lineTo(X,y(x.l));ctx.stroke();let yo=y(Math.max(x.o,x.c)),yc=y(Math.min(x.o,x.c));ctx.fillRect(X-Math.max(1,xstep*.28),yo,Math.max(2,xstep*.56),Math.max(1,yc-yo))});let last=cand.at(-1);ctx.strokeStyle='#00c8ff';ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(0,y(last.c));ctx.lineTo(w,y(last.c));ctx.stroke();ctx.setLineDash([])}

if(tab==='INDEX CALLS'){h=`<div class="tabpage">${indexCards()}${makeWorkspace('STRONG INDEX CALLS',precisionTable(),'ULTRA GATE')}</div>`}
else if(tab==='MARKET'){h=`<div class="tabpage">${indexCards()}${makeWorkspace('MARKET BREADTH / REGIME',`<div class="metricrow"><div class="metricbox">DATA STATUS<b>${esc((S.status||{}).data_status)}</b></div><div class="metricbox">UNIVERSE<b>${esc(((S.status||{}).coverage||{}).symbols_scanned)}</b></div></div>${candidatesTable(rad.slice(0,20))}`)}</div>`}
else if(tab==='SMART MONEY'){h=`<div class="tabpage">${panelCopy('#smartPanel')}${panelCopy('#depthPanel')}${makeWorkspace('INSTITUTIONAL FOOTPRINT',table(((S.footprints||{}).rows)||((S.footprints||{}).footprints)||[],[['Symbol','symbol'],['Institution','institution'],['Activity',r=>esc(r.activity||r.type)],['Value',r=>esc(r.value||r.net_value)],['Source','source']],40),'ATTRIBUTED ONLY')}</div>`}
else if(tab==='FII/DII'){h=`<div class="tabpage">${panelCopy('#fiiPanel')}${makeWorkspace('PARTICIPANT POSITIONING',table(((S.participants||{}).positions)||[],[['Participant','participant'],['Segment','segment'],['Long',r=>esc(r.long_contracts||r.long)],['Short',r=>esc(r.short_contracts||r.short)],['Net',r=>esc(r.net_contracts||r.net_value)],['Bias','bias']],40),'EXCHANGE/INGESTED')}</div>`}
else if(tab==='HEATWAVE'||tab==='SECTORS'){h=`<div class="tabpage">${panelCopy('#sectorPanel')}${makeWorkspace('SECTOR ROTATION / HERO CANDIDATES',candidatesTable(rad.filter(r=>r.sector).slice(0,40)),'ANIMATED')}</div>`}
else if(tab==='AUTO TRENDER'){h=`<div class="tabpage">${makeWorkspace('AUTO TRENDER 3.0',table(rad,[['Symbol','symbol'],['Trend',r=>esc(r.direction||r.side||r.bias)],['Stage','stage'],['Strength',r=>num(r.score,0)],['15s',r=>num((r.history_metrics||{}).price_15s_pct,2)],['60s',r=>num((r.history_metrics||{}).price_60s_pct,2)],['Scouts',r=>esc((r.scout_pack||{}).ready_count)],['Decision',r=>esc((autoCall(r.symbol).call||{}).action||'WAIT')]],80),'LIVE TREND')}</div>`}
else if(tab==='CIRCUITS'){h=`<div class="tabpage">${panelCopy('#circuitsPanel')}${makeWorkspace('CIRCUIT RISK POLICY','<div class="manifest">Near/locked/released circuit candidates remain read-only. Illiquidity and spread can hard-block a call.</div>','RISK-FIRST')}</div>`}
else if(tab==='ULTRA CALLS'){h=`<div class="tabpage">${panelCopy('#callsPanel')}${panelCopy('#opportunitiesPanel')}${makeWorkspace('FULL CALL BOARD',precisionTable(),'TAKE / WAIT')}</div>`}
else if(tab==='CHART PRO'){h=`<div class="tabpage"><section class="glass chartCard span8"><div class="cardhead">CHART PRO — ${S.symbol}</div><div class="chartwrap" style="height:520px"><canvas id="priceChart2"></canvas></div></section><section class="glass panel span4 bigpanel"><h3>LEADING EVIDENCE / LEVEL MEMORY</h3>${memoryTable('LEVEL')}<div class="manifest">Chart context uses provider candles; memory contains observed snapshots only.</div></section>${panelCopy('#levelsPanel')}${panelCopy('#zonesPanel')}${panelCopy('#levelAttackPanel')}${panelCopy('#oiWallPanel')}</div>`}
else if(tab==='ULTRA DERIVATIVES'){h=`<div class="tabpage">${panelCopy('#chainPanel')}${panelCopy('#oiWallPanel')}${panelCopy('#depthPanel')}${panelCopy('#levelAttackPanel')}${makeWorkspace('DERIVATIVE CALLS',precisionTable(),'NO FORCED CALLS')}</div>`}
else if(tab==='OPTION CHAIN'){h=`<div class="tabpage"><section class="glass panel span12 bigpanel"><h3>OPTION CHAIN — ${S.symbol}</h3>${$('#chainPanel').innerHTML}<div class="manifest">Actual provider values only; unavailable Greeks/OI remain N/A.</div></section></div>`}
else if(tab==='OI WALLS'){h=`<div class="tabpage">${panelCopy('#oiWallPanel')}${panelCopy('#levelAttackPanel')}${makeWorkspace('OI WALL MEMORY',memoryTable('OI_WALL'),'PERSISTENT')}</div>`}
else if(tab==='DEPTH/DOM'){h=`<div class="tabpage">${panelCopy('#depthPanel')}${makeWorkspace('ORDER-BOOK / LIQUIDITY MEMORY',memoryTable('LEVEL'),'OBSERVED')}</div>`}
else if(tab==='EXPIRY HERO'){h=`<div class="tabpage">${indexCards()}${makeWorkspace('EXPIRY HERO — HERO ONLY',precisionTable(),'NO HERO = WAIT')}${makeWorkspace('EXPIRY MEMORY',memoryTable('EXPIRY'),'PERSISTENT')}</div>`}
else if(tab==='ALERTS'){h=`<div class="tabpage">${makeWorkspace('LIVE ALERT COMMAND CENTER',((S.alerts||{}).items||[]).slice().reverse().map(x=>`<div class="alert"><span>${new Date((x.epoch||0)*1000).toLocaleString()}</span><div><b>${esc(x.symbol)}</b><br>${esc(x.reason||x.kind)}</div><span class="prio">${esc(x.priority)}</span></div>`).join('')||'<div class="empty">No alerts</div>','P0–P3')}</div>`}
else if(tab==='WATCHLIST'){let rows=S.watchlist.map(sym=>candidate(sym)).filter(x=>x.symbol);h=`<div class="tabpage">${makeWorkspace('WATCHLIST',`${candidatesTable(rows)}<div class="controls"><button class="chip" id="addWatch">Add current ${esc(S.symbol)}</button><button class="chip" id="clearWatch">Clear</button></div>`,'LOCAL + LIVE')}</div>`}
else if(tab==='ACCURACY'){let a=S.accuracy||{},c=a.calibration||{};h=`<div class="tabpage">${panelCopy('#accuracyPanel')}${makeWorkspace('CALIBRATION',`<div class="metricrow"><div class="metricbox">Resolved TAKE<b>${esc(a.resolved_take)}</b></div><div class="metricbox">Minimum Sample<b>${esc(c.minimum_sample)}</b></div><div class="metricbox">Target First<b>${esc(a.target_first)}</b></div><div class="metricbox">Stop First<b>${esc(a.stop_first)}</b></div></div><div class="manifest">No win-rate is displayed as certainty. Calibration remains hidden/insufficient until sample requirements are met.</div>`,'EMPIRICAL ONLY')}</div>`}
else if(tab==='REPLAY'){h=`<div class="tabpage">${makeWorkspace('MARKET REPLAY LAB',memoryTable(null),'IMMUTABLE SNAPSHOTS')}</div>`}
else if(tab==='AUDIT'){let rows=((S.decisions||{}).rows)||[];h=`<div class="tabpage">${makeWorkspace('DECISION AUDIT',table(rows,[['Time',r=>new Date((r.epoch||0)*1000).toLocaleString()],['Symbol','symbol'],['Decision','decision'],['Action','action'],['Meta','meta_score'],['Outcome','outcome'],['Config','config_hash']],120),'CONFIG HASH')}</div>`}
else if(tab==='SYSTEM'){let mf=S.manifest||{},mem=((S.sla||{}).memory)||{};h=`<div class="tabpage">${panelCopy('#systemPanel')}${makeWorkspace('REGRESSION GUARD / FEATURE MANIFEST',`<div class="metricrow"><div class="metricbox">UI MODULES<b>${esc(mf.ui_loaded)}/${esc(mf.ui_required)}</b></div><div class="metricbox">REGRESSION<b class="${mf.regression_guard==='PASS'?'positive':'neutral'}">${esc(mf.regression_guard)}</b></div><div class="metricbox">MEMORY BACKEND<b>${esc(mem.backend)}</b></div><div class="metricbox">DURABLE<b>${mem.durable?'YES':'NO'}</b></div></div>${table(Object.entries(mf.backend_checks||{}).map(([k,v])=>({module:k,status:v?'READY':'MISSING'})),[['Module','module'],['Status','status']],40)}`,'SELF-CHECK')}</div>`}
else h=`<div class="tabpage">${makeWorkspace(tab,'<div class="empty">Module available from cumulative backend; no fabricated data shown.</div>','LIVE')}</div>`;
host.innerHTML=`<section class="fullscreenTab active">${h}</section>`;
if(tab==='CHART PRO'){let old=$('#priceChart'),nu=$('#priceChart2');if(nu&&old){let [ctx,w,hh]=canvasSize(nu);ctx.drawImage(old,0,0,w,hh)}}
if(tab==='WATCHLIST'){let a=$('#addWatch'),c=$('#clearWatch');if(a)a.onclick=()=>{if(!S.watchlist.includes(S.symbol))S.watchlist.push(S.symbol);saveWatchlist();renderTab('WATCHLIST')};if(c)c.onclick=()=>{S.watchlist=[];saveWatchlist();renderTab('WATCHLIST')}}}
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});}setInterval(tick,1000);tick();
$('#tf').onclick=async e=>{let b=e.target.closest('[data-tf]');if(!b)return;S.tf=+b.dataset.tf;$$('#tf .chip').forEach(x=>x.classList.toggle('active',x===b));await loadSymbol();renderAll()};
$('#searchBtn').onclick=()=>{let q=$('#globalSearch').value.trim().toUpperCase();let found=INDEXES.find(x=>q.includes(x[0])||q.includes(x[1]));if(found){selectSymbol(found[0]);return}let row=((((S.status||{}).radar)||{}).candidates||[]).find(x=>String(x.symbol||'').toUpperCase()===q)||((((S.status||{}).radar)||{}).candidates||[]).find(x=>String(x.symbol||'').toUpperCase().includes(q));if(row)selectSymbol(String(row.symbol).toUpperCase())};$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')$('#searchBtn').click()});
$('.mobileBottom').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)openTab(b.dataset.tab)};
window.addEventListener('resize',()=>{renderChartMeta()});
buildNav();load();setInterval(()=>load(),12000);
</script>
</body>
</html>
