<style>
:root{--bg:#07111c;--bg2:#0b1724;--card:#0e1d2c;--line:#20364a;--text:#e9f4ff;--muted:#86a2bb;--green:#19e6a2;--red:#ff5a78;--cyan:#34d9ff;--amber:#ffcb52;--purple:#a98bff;--shadow:0 12px 32px rgba(0,0,0,.24)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101a,#0a1522 55%,#07111c);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select{font:inherit}.app{max-width:1800px;margin:auto;padding:10px 12px 90px}.top{position:sticky;top:0;z-index:20;background:rgba(7,17,28,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 12px;margin:0 -12px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.04em}.crown{font-size:22px}.tag{font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:8px;color:var(--muted)}.tag.ver{background:#12324b;color:#8be6ff}.tag.master{background:#192a20;color:#88ffc7}.search{display:flex;gap:6px;min-width:260px;flex:1;max-width:420px}.search input{width:100%;background:#091522;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}.btn,.chip{border:1px solid var(--line);background:#0a1825;color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer}.btn:hover,.chip:hover,.chip.active{border-color:#3e779d;background:#10283a}.status{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:800}.live{color:var(--green);border-color:#1b7057}.warn{color:var(--amber);border-color:#7d6526}.bad{color:var(--red);border-color:#773246}.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 11px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,rgba(15,31,46,.97),rgba(10,23,35,.97));border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);overflow:hidden}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;font-weight:900;font-size:13px;letter-spacing:.03em}.sub{color:var(--muted);font-size:11px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);background:#091724;border-radius:11px;padding:10px}.metric small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric b{display:block;margin-top:5px;font-size:18px}.up{color:var(--green)!important}.down{color:var(--red)!important}.cyan{color:var(--cyan)!important}.amber{color:var(--amber)!important}.muted{color:var(--muted)!important}.rowcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.move{border:1px solid var(--line);border-radius:11px;padding:10px;background:#091724;cursor:pointer}.move:hover{border-color:#3e779d}.movehead{display:flex;justify-content:space-between;gap:8px;align-items:center}.movehead b{font-size:15px}.signal{font-size:10px;font-weight:900;border-radius:7px;padding:4px 7px}.signal.buy{color:#7dffcc;background:#103729}.signal.sell{color:#ff91a7;background:#421b27}.signal.watch{color:#ffd97a;background:#3b3118}.move .meta{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.45}.reason{margin-top:7px;font-size:11px}.filters{display:flex;gap:6px;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.tbl{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid #172c3d;text-align:right;white-space:nowrap}.tbl th{position:sticky;top:0;background:#0a1927;color:#8faabd;font-size:10px;text-transform:uppercase}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl tr{cursor:pointer}.tbl tbody tr:hover{background:#102537}.chartbox{height:520px;position:relative;border:1px solid var(--line);border-radius:11px;background:#07131f;overflow:hidden}#chartCanvas{width:100%;height:100%;touch-action:none}.charttools{display:flex;gap:6px;flex-wrap:wrap}.chartside{display:grid;gap:8px}.evidence{border:1px solid var(--line);border-radius:10px;padding:9px;background:#091724}.evidence b{display:block;margin-bottom:5px}.evidence p{margin:3px 0;color:var(--muted);font-size:11px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;top:72px;right:14px;width:min(390px,calc(100vw - 28px));z-index:99;background:#0e2030;border:1px solid #3b6d8e;border-radius:13px;padding:13px;box-shadow:0 18px 55px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:.24s}.toast.show{transform:translateX(0);opacity:1}.toast .trow{display:flex;justify-content:space-between;gap:8px}.toast p{margin:8px 0 0;color:#b8cede;line-height:1.4;font-size:12px}.toast button{float:right;margin-top:9px}.healthgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.health{border:1px solid var(--line);border-radius:10px;padding:9px;background:#091724}.health small{color:var(--muted)}.alertrow{display:grid;grid-template-columns:90px 120px 1fr 100px;gap:8px;padding:9px 0;border-bottom:1px solid #183044;align-items:center}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(7,17,28,.96);backdrop-filter:blur(12px);display:none;grid-template-columns:repeat(5,1fr);z-index:30;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:transparent;border:0;color:var(--muted);padding:10px 2px;font-size:10px}.bottom b{display:block;color:var(--text);font-size:17px}.tabpage{display:none}.tabpage.active{display:block}.watermark{font-size:10px;color:#5d7890;margin-top:8px}.callout{border-left:3px solid var(--cyan);padding:9px 11px;background:#0a1927;border-radius:8px;color:#bad0e0;font-size:12px}.kpi{font-size:24px;font-weight:900}.bigmoney{border:1px solid #3e5d43;background:#0c201b}.patterns{border:1px solid #403766;background:#15142a}.danger{border-color:#743547;background:#26131a}.fiirow{display:grid;grid-template-columns:120px 1fr 1fr 1fr 120px;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
@media(max-width:1100px){.span8,.span6,.span4,.span3{grid-column:span 12}.metrics{grid-template-columns:repeat(2,1fr)}.rowcards{grid-template-columns:1fr}.healthgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){body{font-size:13px}.app{padding:8px 8px 78px}.top{margin:0 -8px 8px;padding:8px}.brand{width:100%}.search{min-width:0}.status{margin-left:0;width:100%}.nav{display:none}.metrics{grid-template-columns:1fr 1fr}.metric b{font-size:14px}.chartbox{height:430px}.bottom{display:grid}.alertrow{grid-template-columns:70px 90px 1fr}.alertrow>*:last-child{display:none}.healthgrid{grid-template-columns:1fr}.fiirow{grid-template-columns:90px 1fr 1fr}.fiirow>*:nth-child(4),.fiirow>*:nth-child(5){display:none}.card{padding:10px}}

<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="crown">♛</span> POWERHOUSE AI <span class="tag ver">V74.7</span><span class="tag master">MOVE INTELLIGENCE</span></div>
  <div class="search"><input id="search" placeholder="NIFTY / BANKNIFTY / stock symbol"/><button class="btn" id="searchBtn">Open</button></div>
  <div class="status"><span id="feedPill" class="pill warn">FEED WARMING</span><span id="coveragePill" class="pill">COVERAGE —</span><span id="clock" class="pill">--:--:--</span></div>
</header>
<nav class="nav" id="nav"></nav>

</div>
<nav class="bottom" id="bottom"><button data-tab="COMMAND"><b>⌂</b>Home</button><button data-tab="AUTO TRENDER"><b>↯</b>Trender</button><button data-tab="PRE-MOVE"><b>⚡</b>Pre-Move</button><button data-tab="CHART"><b>⌁</b>Chart</button><button data-tab="ALERTS"><b>♟</b>Alerts</button></nav>
<script>
const TABS=['COMMAND','AUTO TRENDER','PRE-MOVE','LIQUIDITY','CIRCUITS','CHART','SMART MONEY','FII/DII','ALERTS','BLIND SPOTS','SYSTEM'];
const S={tab:'COMMAND',cmd:null,trender:null,fii:null,system:null,scope:'ALL',tf:5,symbol:'NIFTY',intel:null,why:null,alertHistory:[],lastAlertEpoch:0,queue:[],toastBusy:false,visibleN:90};
const $=s=>document.querySelector(s), esc=x=>String(x??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=(x,d=2)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—'; const pct=x=>Number.isFinite(Number(x))?(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%':'—';
async function j(url,opts={}){let c=new AbortController(),t=setTimeout(()=>c.abort(),opts.timeout||22000);try{let r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error(r.status+' '+await r.text());return await r.json()}finally{clearTimeout(t)}}
function sigClass(s){s=String(s||'WATCH').toUpperCase();return /BUY|UP/.test(s)?'buy':/SELL|DOWN/.test(s)?'sell':'watch'}
function price(x){return Number.isFinite(Number(x))?Number(x).toLocaleString('en-IN',{maximumFractionDigits:2}):'—'}
function money(x){x=Number(x);if(!Number.isFinite(x))return '—';if(Math.abs(x)>=1e9)return '₹'+(x/1e9).toFixed(2)+'B';if(Math.abs(x)>=1e7)return '₹'+(x/1e7).toFixed(2)+'Cr';if(Math.abs(x)>=1e6)return '₹'+(x/1e6).toFixed(1)+'M';return '₹'+x.toLocaleString('en-IN',{maximumFractionDigits:0})}
function nav(){let h=TABS.map(t=>`<button class="chip ${S.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')+`<button class="chip" onclick="location.href='/v746'">V74.6 Legacy</button>`;$('#nav').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}
function openTab(t){S.tab=t;nav();render();if(t==='CHART')loadChart();if(t==='FII/DII')loadFii();if(t==='SYSTEM')loadSystem();}
function metric(k,v,s='',cls=''){return `<div class="metric"><small>${esc(k)}</small><b class="${cls}">${esc(v)}</b><span class="sub">${esc(s)}</span></div>`}
function moveCard(r){let pl=r.plan||{},ez=pl.entry_zone||[];return `<div class="move" onclick="selectSymbol('${esc(r.symbol)}')"><div class="movehead"><b>${esc(r.symbol)}</b><span class="signal ${sigClass(r.signal)}">${esc(r.signal||r.direction)}</span></div><div class="meta">${esc(r.stage)} · ${pct(r.change_pct)} · Strength ${num(r.strength??r.anomaly_score,0)} · Exec ${num(r.execution_quality,0)}<br>RVOL ${num(r.rvol,2)}x · Depth ${num((r.depth||{}).pressure,0)}% · 30s ${pct((r.price_velocity||{})['30s_pct'])}<br>${ez.length?`Entry ${price(ez[0])}–${price(ez[1])} · SL ${price(pl.invalidation)} · T1 ${price(pl.t1)}`:'Entry plan: '+esc(pl.state||'WATCH')}</div><div class="reason">${(r.reasons||[]).slice(0,2).map(esc).join(' · ')||esc(r.large_flow_state)}</div></div>`}
function table(rows){rows=rows||[];if(!rows.length)return '<div class="empty">No qualified rows yet. Scanner may still be warming.</div>';return `<div class="tablewrap"><table class="tbl"><thead><tr><th>Symbol</th><th>Signal</th><th>Stage</th><th>LTP</th><th>%Chg</th><th>Strength</th><th>Accel</th><th>RVOL</th><th>Depth</th><th>Turnover</th><th>Entry</th><th>SL</th><th>T1</th></tr></thead><tbody>${rows.map(r=>{let p=r.plan||{},z=p.entry_zone||[];return `<tr onclick="selectSymbol('${esc(r.symbol)}')"><td><b>${esc(r.symbol)}</b></td><td><span class="signal ${sigClass(r.signal)}">${esc(r.signal||'WATCH')}</span></td><td>${esc(r.stage)}</td><td>${price(r.ltp)}</td><td class="${Number(r.change_pct)>=0?'up':'down'}">${pct(r.change_pct)}</td><td>${num(r.strength??r.anomaly_score,0)}</td><td>${pct(r.timeframe_velocity_pct??r.acceleration)}</td><td>${num(r.rvol,2)}</td><td>${num((r.depth||{}).pressure,0)}%</td><td>${money(r.turnover)}</td><td>${z.length?price(z[0])+'–'+price(z[1]):'—'}</td><td>${price(p.invalidation)}</td><td>${price(p.t1)}</td></tr>`}).join('')}</tbody></table></div>`}
function command(){let d=S.cmd||{},m=d.whole_market||{},c=m.counts||{},cov=m.coverage||{},health=d.module_health||{},pre=(m.pre_move||[]).slice(0,8),up=(m.up||[]).slice(0,6),dn=(m.down||[]).slice(0,6);return `<div class="grid"><section class="card span12"><div class="title">LIVE MOVE CONTROL ROOM <span class="tag">DISCOVER FIRST → JUDGE LATER</span></div><div class="metrics">${metric('NSE Cash Observed',cov.observed??'—',`${num(cov.coverage_pct,1)}% coverage`,'cyan')}${metric('Pre-Move',c.pre_move??0,'building / trigger-near','amber')}${metric('Fast Lane',c.fast_lane??0,'exceptional anomaly','up')}${metric('Up / Down',`${c.up??0} / ${c.down??0}`,'symmetric scan')}${metric('Baselines Ready',cov.baseline_ready??0,'same-time RVOL hydration')}</div></section><section class="card span8"><div class="title">⚡ PRE-MOVE / IGNITION <span class="sub">early evidence, not profit guarantee</span></div><div class="rowcards">${pre.length?pre.map(moveCard).join(''):'<div class="empty">Warming / no strong pre-move state</div>'}</div></section><section class="card span4"><div class="title">MODULE HEALTH</div><div class="healthgrid">${Object.entries(health).filter(([k,v])=>v&&typeof v==='object'&&v.state).map(([k,v])=>`<div class="health"><b>${esc(k.replaceAll('_',' ').toUpperCase())}</b><br><span class="${v.state==='LIVE'?'up':v.state==='WARMING'?'amber':'muted'}">${esc(v.state)}</span><br><small>${v.age_sec!=null?'age '+v.age_sec+'s':''}</small></div>`).join('')}</div></section><section class="card span6"><div class="title">↑ UPSIDE MOVERS</div><div class="rowcards">${up.map(moveCard).join('')||'<div class="empty">—</div>'}</div></section><section class="card span6"><div class="title">↓ DOWNSIDE MOVERS</div><div class="rowcards">${dn.map(moveCard).join('')||'<div class="empty">—</div>'}</div></section></div>`}
function trender(){let rows=(S.trender||{}).rows||[];return `<div class="grid"><section class="card span12"><div class="title">AUTO TRENDER NXT — INDEX + STOCKS <span class="tag">SMC-STYLE CLARITY + POWERHOUSE INTELLIGENCE</span></div><div class="filters"><button class="chip ${S.scope==='ALL'?'active':''}" onclick="setScope('ALL')">ALL</button><button class="chip ${S.scope==='INDEX'?'active':''}" onclick="setScope('INDEX')">INDEX</button><button class="chip ${S.scope==='STOCKS'?'active':''}" onclick="setScope('STOCKS')">STOCKS</button><span style="width:12px"></span>${[3,5,15].map(x=>`<button class="chip ${S.tf===x?'active':''}" onclick="setTf(${x})">${x}m</button>`).join('')}</div><div class="callout" style="margin:10px 0">EARLY BUY/SELL → TRIGGER NEAR → BUY/SELL → MOVE ACTIVE. Entry/SL/targets are planning levels; chart structure supersedes generic bands.</div>${table(rows)}</section></div>`}
function premove(){let m=(S.cmd||{}).whole_market||{},rows=m.pre_move||[];return `<div class="grid"><section class="card span12"><div class="title">PRE-MOVE RADAR <span class="tag">UP + DOWN</span></div>${table(rows)}</section></div>`}
function liquidity(){let m=(S.cmd||{}).whole_market||{},rows=m.unusual_liquidity||[];return `<div class="grid"><section class="card span12"><div class="title">LIQUIDITY / TURNOVER FAST LANE <span class="tag">ORDER BOOK + RVOL + ₹ FLOW</span></div>${table(rows)}</section></div>`}
function circuits(){let rows=((S.cmd||{}).whole_market||{}).circuits||[];return `<div class="grid"><section class="card span12"><div class="title">CIRCUIT HUNTER — UC + LC <span class="tag">EARLY PRESSURE → ARMING → PRE-CIRCUIT → LOCK</span></div>${rows.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>Symbol</th><th>Direction</th><th>State</th><th>LTP</th><th>%Chg</th><th>UC</th><th>Dist UC</th><th>LC</th><th>Dist LC</th><th>Depth</th><th>RVOL</th></tr></thead><tbody>${rows.map(r=>`<tr onclick="selectSymbol('${esc(r.symbol)}')"><td><b>${esc(r.symbol)}</b></td><td class="${r.direction==='UP'?'up':'down'}">${esc(r.direction)}</td><td>${esc(r.circuit_state)}</td><td>${price(r.ltp)}</td><td>${pct(r.change_pct)}</td><td>${price(r.upper_circuit)}</td><td>${pct(r.distance_to_uc_pct)}</td><td>${price(r.lower_circuit)}</td><td>${pct(r.distance_to_lc_pct)}</td><td>${num((r.depth||{}).pressure,0)}%</td><td>${num(r.rvol,2)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No circuit-pressure row in current observed set.</div>'}</section></div>`}
function patternsFromIntel(){let c=(S.intel||{}).chart||{},b=c.base_v67||{},p=(c.patterns||b.forming_patterns||[]),h=b.harmonics||[],cand=b.candlestick_forming||[];return {p,h,cand,b}}
function chartPage(){let {p,h,cand,b}=patternsFromIntel(),bm=b.big_money_entry||{},sm=b.smart_money||{};return `<div class="grid"><section class="card span8"><div class="title"><span>${esc(S.symbol)} — TRADING INTELLIGENCE CHART</span><div class="charttools">${[1,3,5,15,30].map(x=>`<button class="chip ${S.tf===x?'active':''}" onclick="setChartTf(${x})">${x}m</button>`).join('')}<button class="chip" onclick="zoomChart(-15)">−</button><button class="chip" onclick="zoomChart(15)">+</button><button class="chip" onclick="zoomReset()">Reset</button></div></div><div class="chartbox"><canvas id="chartCanvas"></canvas></div><div class="watermark">Price autoscale uses visible candles only. Distant OI walls cannot flatten the candle chart.</div></section><section class="card span4"><div class="chartside"><div class="evidence patterns"><b>SUPER ADVANCED PATTERN</b>${p.length?p.slice(0,6).map(x=>`<p><strong>${esc(x.pattern)}</strong> · ${esc(x.stage)} · Quality ${num(x.formation_quality,0)}<br>Trigger ${price(x.trigger)} · Invalid ${price(x.invalidation)}</p>`).join(''):'<p>No qualified forming pattern / chart may still be loading.</p>'}${h.slice(0,3).map(x=>`<p>Harmonic: ${esc(x.pattern)} · ${esc(x.stage)} · ${num(x.formation_quality,0)}</p>`).join('')}${cand.slice(0,3).map(x=>`<p>Candle: ${esc(x.name)} · ${esc(x.stage)} · ${num(x.formation_quality,0)}</p>`).join('')}</div><div class="evidence bigmoney"><b>PLAN ENTRY WITH BIG / SMART MONEY</b><p>State: <strong>${esc(bm.state||sm.state||'NO VERIFIED FOOTPRINT')}</strong></p><p>Side: ${esc(bm.side||'—')} · Score ${num(bm.score??sm.pressure_score,0)}</p><p>Zone: ${price(bm.zone_low)}–${price(bm.zone_high)} · Trigger ${price(bm.trigger)} · Invalidation ${price(bm.invalidation)}</p><p>${(bm.evidence||sm.bull_evidence||[]).slice(0,4).map(esc).join(' · ')}</p></div><div id="whyPanel" class="evidence"><b>WHY MOVING?</b><p>Open a stock from Auto Trender/Pre-Move or search symbol.</p></div></div></section></div>`}
function smartMoney(){let rows=(((S.cmd||{}).whole_market||{}).rows||[]).filter(x=>x.large_flow_state&&x.large_flow_state!=='NO CLEAR LARGE-FLOW FOOTPRINT').slice(0,100);return `<div class="grid"><section class="card span12"><div class="title">SMART / LARGE-FLOW FOOTPRINT <span class="tag">ANONYMOUS FLOW — NO FALSE FII IDENTITY</span></div>${table(rows)}</section></div>`}
function fii(){let d=S.fii||{},cash=(d.cash||{}),rows=cash.latest||[],pos=(d.participant_oi||{}).positions||[];return `<div class="grid"><section class="card span6"><div class="title">FII / DII CASH ACTIVITY <span class="tag">${esc(cash.status||'LOADING')}</span></div>${rows.length?rows.map(r=>`<div class="fiirow"><b>${esc(r.category||r.participant)}</b><span>Buy ${esc(r.buy_value)}</span><span>Sell ${esc(r.sell_value)}</span><span>Net ${esc(r.net_value)}</span><span>${esc(r.date||r.trade_date||'')}</span></div>`).join(''):'<div class="empty">'+esc(cash.reason||'Loading official data…')+'</div>'}<div class="watermark">${esc(cash.source||'')}</div></section><section class="card span6"><div class="title">PARTICIPANT DERIVATIVES POSITIONING <span class="tag">EXCHANGE REPORT</span></div>${pos.length?`<div class="tablewrap"><table class="tbl"><thead><tr>${Object.keys(pos[0]).slice(0,8).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${pos.slice(0,20).map(r=>`<tr>${Object.keys(pos[0]).slice(0,8).map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">'+esc((d.participant_oi||{}).reason||'Loading participant OI…')+'</div>'}</section></div>`}
function alertsPage(){let rows=S.alertHistory.slice().reverse();return `<div class="grid"><section class="card span12"><div class="title">ONE-BY-ONE SMART ALERTS <span class="tag">FIFO QUEUE · NO CLUSTER</span></div><div class="callout">Every fresh alert is preserved in the client queue and surfaced sequentially. Same-stock lifecycle upgrades are deduplicated by the backend.</div>${rows.length?rows.map(x=>`<div class="alertrow"><span>${new Date((x.epoch||0)*1000).toLocaleTimeString()}</span><b>${esc(x.symbol)}</b><span>${esc(x.title)}<br><small class="muted">${esc(x.body)}</small></span><span class="signal ${sigClass(x.severity)}">${esc(x.severity)}</span></div>`).join(''):'<div class="empty">No alerts yet.</div>'}</section></div>`}
function blind(){let b=(((S.cmd||{}).whole_market||{}).blind_spot)||{},rows=b.forced_discovery||[];return `<div class="grid"><section class="card span12 ${rows.length?'danger':''}"><div class="title">BLIND-SPOT SENTINEL <span class="tag">ZERO AVOIDABLE SILENT MISS</span></div>${rows.length?`<div class="callout">${rows.length} meaningful observed mover(s) exist outside the alerted set. They are forced into the hot lane for audit.</div>${table(rows)}`:'<div class="empty up">PASS — no meaningful observed mover currently outside the alerted radar.</div>'}</section></div>`}
function system(){let d=S.system||{},h=d.module_health||{},f=d.features||{};return `<div class="grid"><section class="card span6"><div class="title">SYSTEM / DATA HEALTH <span class="tag">V${esc(d.version||'74.7')}</span></div><div class="healthgrid">${Object.entries(h).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>`<div class="health"><b>${esc(k.replaceAll('_',' ').toUpperCase())}</b><br><span>${esc(v.state||'—')}</span><br><small>${esc(v.source||'')}</small></div>`).join('')}</div></section><section class="card span6"><div class="title">V74.7 FEATURE CONTRACT</div>${Object.entries(f).map(([k,v])=>`<div class="fiirow"><b>${esc(k)}</b><span class="up">${esc(v)}</span><span></span><span></span><span></span></div>`).join('')}</section></div>`}
function render(){let p=S.tab==='COMMAND'?command():S.tab==='AUTO TRENDER'?trender():S.tab==='PRE-MOVE'?premove():S.tab==='LIQUIDITY'?liquidity():S.tab==='CIRCUITS'?circuits():S.tab==='CHART'?chartPage():S.tab==='SMART MONEY'?smartMoney():S.tab==='FII/DII'?fii():S.tab==='ALERTS'?alertsPage():S.tab==='BLIND SPOTS'?blind():system();$('#pages').innerHTML=`<section class="tabpage active">${p}</section>`;if(S.tab==='CHART'){setTimeout(()=>{drawChart();renderWhy()},30)}}
function setScope(x){S.scope=x;loadTrender()} function setTf(x){S.tf=x;loadTrender()} function setChartTf(x){S.tf=x;loadChart()} function zoomChart(d){S.visibleN=Math.max(25,Math.min(180,S.visibleN+d));drawChart()} function zoomReset(){S.visibleN=90;drawChart()}
async function loadCommand(){try{S.cmd=await j('/api/v74.7/command-center?profile=AGGRESSIVE',{timeout:30000});updateStatus();if(['COMMAND','PRE-MOVE','LIQUIDITY','CIRCUITS','SMART MONEY','BLIND SPOTS'].includes(S.tab))render()}catch(e){$('#feedPill').textContent='FEED ERROR';$('#feedPill').className='pill bad'}}
async function loadTrender(){try{S.trender=await j(`/api/v74.7/auto-trender?scope=${encodeURIComponent(S.scope)}&timeframe=${S.tf}&limit=160`,{timeout:30000});if(S.tab==='AUTO TRENDER')render()}catch(e){}}
async function loadFii(){try{S.fii=await j('/api/v74.7/fii-dii',{timeout:30000});if(S.tab==='FII/DII')render()}catch(e){S.fii={cash:{status:'ERROR',reason:e.message}};render()}}
async function loadSystem(){try{S.system=await j('/api/v74.7/system');if(S.tab==='SYSTEM')render()}catch(e){}}
async function loadChart(){try{S.intel=await j(`/api/v74.3/intelligence/${encodeURIComponent(S.symbol)}?interval=${S.tf}&limit=180`,{timeout:30000});S.why=await j(`/api/v74.7/why/${encodeURIComponent(S.symbol)}`,{timeout:16000}).catch(()=>null);if(S.tab==='CHART')render()}catch(e){S.intel={errors:[e.message],candles:[]};if(S.tab==='CHART')render()}}
async function selectSymbol(sym){S.symbol=String(sym||'').toUpperCase();S.tab='CHART';nav();await loadChart()}
function updateStatus(){let h=(S.cmd||{}).module_health||{},m=h.market_feed||{},cov=h.whole_cash||{};$('#feedPill').textContent='FEED '+(m.state||'—');$('#feedPill').className='pill '+(m.state==='LIVE'?'live':m.state==='WARMING'?'warn':'bad');$('#coveragePill').textContent='COVERAGE '+num(cov.coverage_pct,1)+'%'}
async function pollAlerts(){try{let first=S.lastAlertEpoch===0,u='/api/v74.7/alerts?since_epoch='+encodeURIComponent(S.lastAlertEpoch)+'&limit=300',d=await j(u,{timeout:10000}),rows=d.items||[];if(rows.length){rows.sort((a,b)=>(a.epoch||0)-(b.epoch||0));let latest=Math.max(...rows.map(x=>Number(x.epoch)||0));if(first){S.alertHistory=rows.slice(-120);S.queue.push(...rows.slice(-8));S.lastAlertEpoch=latest}else{for(let x of rows){if((x.epoch||0)>S.lastAlertEpoch){S.queue.push(x);S.alertHistory.push(x);S.lastAlertEpoch=Math.max(S.lastAlertEpoch,x.epoch||0)}}}S.alertHistory=S.alertHistory.slice(-500);pumpToast();if(S.tab==='ALERTS')render()}}catch(e){}}
function pumpToast(){if(S.toastBusy||!S.queue.length)return;S.toastBusy=true;let x=S.queue.shift(),t=$('#toast');t.innerHTML=`<div class="trow"><b>${esc(x.title||x.symbol)}</b><span class="signal ${sigClass(x.severity)}">${esc(x.severity)}</span></div><p>${esc(x.body||x.kind)}</p><button class="chip" onclick="dismissToast()">Next</button>`;t.classList.add('show');pumpToast._timer=setTimeout(dismissToast,6200)}
function dismissToast(){clearTimeout(pumpToast._timer);let t=$('#toast');t.classList.remove('show');setTimeout(()=>{S.toastBusy=false;pumpToast()},240)}
function candles(){return ((S.intel||{}).candles||[]).map(x=>Array.isArray(x)?{t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+(x[5]||0)}:{t:x.timestamp||x.ts,o:+(x.open??x.o),h:+(x.high??x.h),l:+(x.low??x.l),c:+(x.close??x.c),v:+(x.volume??x.v??0)}).filter(x=>[x.o,x.h,x.l,x.c].every(Number.isFinite))}
function drawChart(){let cv=$('#chartCanvas');if(!cv)return;let box=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.floor(box.width*d);cv.height=Math.floor(box.height*d);let ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);let w=box.width,h=box.height;ctx.clearRect(0,0,w,h);let cs=candles().slice(-S.visibleN);if(!cs.length){ctx.fillStyle='#86a2bb';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('NO VERIFIED CANDLE DATA — '+esc(((S.intel||{}).errors||[])[0]||'loading'),w/2,h/2);return}let right=72,bottom=28,left=8,top=12,pw=w-right-left,ph=h-bottom-top;let mn=Math.min(...cs.map(x=>x.l)),mx=Math.max(...cs.map(x=>x.h)),pad=(mx-mn)*.07||Math.max(mx*.002,1);mn-=pad;mx+=pad;let y=v=>top+(mx-v)/(mx-mn)*ph,x=i=>left+(i+.5)*pw/cs.length;ctx.strokeStyle='#173046';ctx.lineWidth=1;ctx.font='10px sans-serif';ctx.fillStyle='#7692a9';ctx.textAlign='left';for(let i=0;i<6;i++){let yy=top+i*ph/5,val=mx-i*(mx-mn)/5;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+pw,yy);ctx.stroke();ctx.fillText(val.toFixed(2),left+pw+6,yy+3)}for(let i=0;i<5;i++){let ix=Math.floor(i*(cs.length-1)/4),xx=x(ix);ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx,top+ph);ctx.stroke();let dt=new Date(cs[ix].t);ctx.fillText(isNaN(dt)?'':dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),Math.min(xx,left+pw-35),h-8)}let bar=Math.max(2,pw/cs.length*.62);for(let i=0;i<cs.length;i++){let q=cs[i],xx=x(i),up=q.c>=q.o,col=up?'#19e6a2':'#ff5a78';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(xx,y(q.h));ctx.lineTo(xx,y(q.l));ctx.stroke();let ya=y(Math.max(q.o,q.c)),yb=y(Math.min(q.o,q.c));ctx.fillRect(xx-bar/2,ya,bar,Math.max(1,yb-ya))}let lev=(S.intel||{}).levels||{},chart=(S.intel||{}).chart||{},b=chart.base_v67||{},bm=b.big_money_entry||{},patterns=chart.patterns||b.forming_patterns||[];function line(v,col,label,dash=[5,4]){v=Number(v);if(!Number.isFinite(v)||v<mn||v>mx)return;ctx.strokeStyle=col;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(left,y(v));ctx.lineTo(left+pw,y(v));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.fillText(label+' '+v.toFixed(2),left+5,Math.max(top+10,y(v)-3))}line(lev.support,'#19e6a2','SUP');line(lev.resistance,'#ff5a78','RES');if(lev.demand&&Number.isFinite(+lev.demand.low)&&Number.isFinite(+lev.demand.high)){ctx.fillStyle='rgba(25,230,162,.08)';ctx.fillRect(left,y(+lev.demand.high),pw,Math.max(2,y(+lev.demand.low)-y(+lev.demand.high)))}if(lev.supply&&Number.isFinite(+lev.supply.low)&&Number.isFinite(+lev.supply.high)){ctx.fillStyle='rgba(255,90,120,.08)';ctx.fillRect(left,y(+lev.supply.high),pw,Math.max(2,y(+lev.supply.low)-y(+lev.supply.high)))}if(bm.available){if(Number.isFinite(+bm.zone_low)&&Number.isFinite(+bm.zone_high)){ctx.fillStyle='rgba(169,139,255,.10)';ctx.fillRect(left,y(+bm.zone_high),pw,Math.max(2,y(+bm.zone_low)-y(+bm.zone_high)));line(bm.trigger,'#a98bff','SMART TRIGGER',[2,3]);line(bm.invalidation,'#ffcb52','INVALID',[2,3])}}if(patterns[0]){line(patterns[0].trigger,'#34d9ff',patterns[0].pattern||'PATTERN',[7,3]);line(patterns[0].invalidation,'#ffcb52','PATT INVALID',[3,3])}let last=cs.at(-1);line(last.c,'#34d9ff','LTP',[2,2]);cv.onmousemove=e=>{let r=cv.getBoundingClientRect(),ix=Math.max(0,Math.min(cs.length-1,Math.floor((e.clientX-r.left-left)/pw*cs.length))),q=cs[ix];cv.title=`${new Date(q.t).toLocaleString()}  O ${q.o} H ${q.h} L ${q.l} C ${q.c} V ${q.v}`}}
function renderWhy(){let h=$('#whyPanel');if(!h)return;let d=S.why||{},m=d.market_evidence||{},c=d.catalyst||{},items=c.items||[];h.innerHTML=`<b>WHY MOVING?</b><p><strong>${esc(d.classification||'UNKNOWN')}</strong></p><p>${(m.reasons||[]).slice(0,5).map(esc).join(' · ')||'No market-flow explanation available.'}</p>${items.slice(0,3).map(x=>`<p>• ${esc(x.subject||x.details)}<br><small>${esc(x.timestamp||'')} · NSE filing</small></p>`).join('')}<p class="muted">No verified catalyst = software must say UNKNOWN/FLOW, never invent a reason.</p>`}
$('#searchBtn').onclick=()=>{let q=$('#search').value.trim().toUpperCase();if(q)selectSymbol(q)};$('#search').addEventListener('keydown',e=>{if(e.key==='Enter')$('#searchBtn').click()});$('#bottom').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)openTab(b.dataset.tab)};
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString()}setInterval(tick,1000);tick();nav();render();loadCommand();loadTrender();pollAlerts();setInterval(loadCommand,10000);setInterval(loadTrender,12000);setInterval(pollAlerts,3500);addEventListener('resize',()=>{if(S.tab==='CHART')drawChart()});
</script>
